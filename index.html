<style>

<script>
'use strict';
/* ===== Fragen-Daten (nur echte Fakten; Lücken in [ … ]) ===== */
const GROUPS=[
 ['motiv','Motivation & Rollenwechsel'],['fach','Lean-Fachfragen'],['praxis','Praxis & Ergebnisse'],['widerstand','Widerstand & Coaching'],
 ['politik','Führung & Politik intern'],['tage90','90 Tage'],['schwach','Schwächen & Lernfeld'],['rueck','Rückfragen'],
 ['j_tpm','Stelle · TPM & Kennzahlen'],['j_auf','Stelle · Aufgaben & Rollout'],['j_prof','Stelle · Profil & Motivation'],['j_en','Stelle · English']];
const JOBG=['j_tpm','j_auf','j_prof','j_en'];
const GL=Object.fromEntries(GROUPS);
const QS=[];
function Q(id,g,q,pruef,ger,muster,bad,good,nach,kern,top){QS.push({id,g,q,pruef,ger,muster,bad,good,nach,kern,top:!!top});}

Q('q01','motiv','Du kommst aus der Linie. Warum Consultant – und nicht Meister oder Teamleiter?',
 'Ob du aus Überzeugung wechselst oder nur weg willst – und ob du den Unterschied zwischen „eine Linie führen“ und „Veränderung anstoßen“ verstehst.',
 ['Woher du kommst – ein Satz, echte Jahre.','Der Moment, der dich gepackt hat: Anlage A.','Warum das breiter ist als eine Linie – und ehrlich, was du noch lernen musst.'],
 `Ich bin seit [Jahre gesamt ergänzen] Jahren hier in der Produktion, zwei Jahre davon als Vertretung des Vorarbeiters, eins als Rüstoptimierer. Als Vertretung habe ich gemerkt: Ich kann eine Schicht durch den Tag bringen. Aber was mich wirklich gepackt hat, war Anlage A. Da hat ein Formatwechsel rund 8 Stunden gedauert, danach meistens 3 bis 5. Nicht, weil ich schneller geschraubt habe, sondern weil wir den Ablauf geändert haben: Werkzeugwagen vorher da, Schlosser fest eingeplant, Pausen so gelegt, dass sie nicht in den Wechsel fallen. Als Meister wäre ich für eine Linie da. Als Lean Consultant kann ich so etwas an mehreren Linien anstoßen – und zwar so, dass die Leute vor Ort es selbst tragen. Das will ich machen. Und ehrlich: Methodisch muss ich dafür noch dazulernen. [deine Erfahrung ergänzen: Schulung oder Kurs, den du schon angefangen hast]`,
 '„Ich will mich weiterentwickeln.“','„Ich will das, was an Anlage A funktioniert hat, an mehr Linien möglich machen.“',
 'Und wenn es mit der Stelle nicht klappt – gehst du dann zurück an die Linie?',
 'Anlage A hat mich gepackt: Ablauf ändern statt schneller schrauben – das will ich an mehr Linien möglich machen.',true);

Q('q02','motiv','Was unterscheidet einen Lean Consultant von einem Rüstoptimierer?',
 'Ob du verstehst, dass die neue Rolle nicht „mehr vom Gleichen“ ist: weg vom Selbermachen, hin zu Befähigen, Methode und mehreren Bereichen.',
 ['Rüstoptimierer: eine Anlage, ein Thema [ergänzen: selbst mit angepackt?].','Consultant: mehrere Bereiche, Methode, andere befähigen, Führung einbinden.','Was du mitnimmst – und was du ändern musst.'],
 `Als Rüstoptimierer hatte ich ein Thema und eine Anlage: den Formatwechsel an Anlage A. Ich habe die Abweichungen vom Rüstdrehbuch aufgeschrieben und in der Rüstauswertung mit dem Team besprochen. [ergänzen: Hast du beim Rüsten selbst mit angepackt? Nur sagen, wenn ja.] Ein Lean Consultant hat mehrere Linien und mehr Themen – nicht nur Rüsten, auch Störungen, Qualität, Abläufe. Der größte Unterschied: Als Consultant mache ich es nicht selbst. Ich helfe dem Meister und der Schicht, das Problem selbst zu sehen und selbst zu lösen. Ich bringe die Methode mit – zum Beispiel trennen, was nur bei stehender Anlage geht und was vorher geht, oder Ursachen mit 5-Why suchen. Und ich sorge dafür, dass die Führung den Standard trägt. Mein Erfolg ist dann nicht, dass ich etwas verbessert habe, sondern dass die Linie ohne mich weiter verbessert. Das ist für mich der Kern der neuen Rolle.`,
 '„Eigentlich dasselbe, nur größer.“','„Als Rüstoptimierer war ich für eine Anlage da – als Consultant sorge ich dafür, dass andere es machen und es hält.“',
 'Was fällt dir schwerer: selbst machen oder andere machen lassen?',
 'Rüstoptimierer: eine Anlage, ein Thema – Consultant: mehrere Linien, befähigt andere, Standard muss ohne ihn halten.',true);

Q('q03','motiv','Warum sollten wir jemanden von innen nehmen – und nicht einen erfahrenen Berater von außen?',
 'Ob du deinen Heimvorteil kennst, ohne die Nachteile kleinzureden: Betriebsblindheit und die alte Rolle als Kollege.',
 ['Vorteil: Du kennst Werk, Leute, Anlagen.','Risiko ehrlich benennen: blinde Flecken, man kennt dich als Kollegen.','Wie du das Risiko auffängst.'],
 `Ich kenne das Werk von innen. Ich weiß, wie ein Formatwechsel an Anlage A wirklich abläuft, wo der Werkzeugwagen steht und warum die Schlosser manchmal woanders sind. Ein Externer braucht lange, bis er das sieht – und bis die Leute ihm überhaupt etwas erzählen. Mir erzählen sie es in der Pause. Das ist mein Vorteil. Das Risiko sehe ich auch: Ich bin vielleicht betriebsblind, und manche kennen mich nur als Kollegen aus der Schicht. Gegen die Betriebsblindheit hilft mir, dass ich an Anlage A selbst lange übersehen habe, wie viele Arbeiten im Stillstand liefen, die man vorher hätte machen können. Seitdem frage ich lieber einmal mehr, warum wir etwas so machen. Und bei der Kollegen-Rolle: Ich erkläre niemandem etwas von oben, ich fange mit dem Problem an, das ihn selbst nervt. Methode kann ich mir dazuholen – [deine Erfahrung ergänzen: Lean-Team, Schulung, Austausch mit anderen].`,
 '„Ich kenne hier einfach alles.“','„Ich kenne das Werk – und weiß, dass ich deshalb auch blinde Flecken habe.“',
 'Wo bist du selbst betriebsblind?',
 'Ich kenne Werk und Leute von innen – und achte bewusst auf meine blinden Flecken.');

Q('q04','fach','Was ist OEE – und wo verliert eine Anlage bei euch am meisten?',
 'Ob du die Kennzahl wirklich verstehst (drei Faktoren) und sie auf eure Anlagen beziehen kannst – ohne Zahlen zu erfinden.',
 ['Definition: Verfügbarkeit × Leistung × Qualität, je ein Satz.','Rüsten frisst Verfügbarkeit – wenn es nicht als geplanter Stillstand rausgerechnet wird.','Ein eigenes Beispiel (Qualitätsthema) – und ehrlich sagen, was gemessen wurde.'],
 `OEE heißt Gesamtanlageneffektivität. Das sind drei Faktoren, die man multipliziert. Verfügbarkeit: Läuft die Anlage in der geplanten Zeit überhaupt? Leistung: Läuft sie mit der vorgesehenen Geschwindigkeit, oder verliert sie durch kleine Stopps und langsames Fahren? Und Qualität: Wie viel davon ist Gutware? Beim Rüsten muss man genau sein. Rüsten frisst Verfügbarkeit, wenn es nicht als geplanter Stillstand rausgerechnet wird. [ergänzen: Wie wird bei dir Rüsten in der OEE gerechnet?] Wo eine Anlage am meisten verliert, sage ich lieber an einem Beispiel als pauschal: [ergänzen: ein Qualitätsthema – was war los, wie habt ihr es gemerkt, was wurde geändert?] Das zeigt mir: Nicht jeder Verlust ist Stillstand. Manchmal läuft die Anlage und macht trotzdem nicht, was wir brauchen. Eine formale OEE-Messung hatte ich beim Rüsten nicht, das sage ich ehrlich. An einer neuen Linie würde ich erst schauen, welche Zahlen es gibt, und dann mit dem Meister klären, welcher der drei Faktoren am meisten weh tut.`,
 '„Unsere OEE liegt bei ungefähr X Prozent.“ – wenn du die Zahl nicht sicher kennst.','„Rüsten frisst Verfügbarkeit – wenn es nicht als geplanter Stillstand rausgerechnet wird. Das hängt davon ab, wie gerechnet wird.“',
 'Wie würdest du OEE an einer Linie einführen, an der es kaum Daten gibt?',
 'OEE = Verfügbarkeit × Leistung × Qualität. Rüsten frisst Verfügbarkeit, wenn es nicht als geplanter Stillstand rausgerechnet wird. [ergänzen: Wie wird bei dir Rüsten in der OEE gerechnet?]',true);

Q('q05','fach','Erklär einem Bediener in zwei Sätzen, was internes und externes Rüsten ist – ohne Fachwort. (SMED)',
 'Ob du Methode einfach erklären kannst – das ist später dein Alltag an der Linie.',
 ['Zwei Sorten Arbeit: nur bei stehender Anlage – oder auch bei laufender.','Alles, was geht, vor den Stopp ziehen.','Beispiel Werkzeugwagen – dann erst das Fachwort.'],
 `Ich würde es so sagen: Beim Formatwechsel gibt es zwei Sorten Arbeit. Die eine geht nur, wenn die Anlage steht – Formatteile tauschen zum Beispiel. Die andere kann man machen, während die Anlage noch läuft oder schon wieder läuft – Werkzeug holen, Teile bereitlegen, aufräumen. Die zweite Sorte soll nicht mehr im Stillstand passieren. An Anlage A kam der Werkzeugwagen oft erst, wenn die Maschine schon stand. Also stand die Maschine, während jemand Werkzeug geholt hat. Wir haben den Wagen vor den Auslauf gezogen – jetzt ist alles da, wenn die Maschine stoppt. Das ist eigentlich schon die ganze Idee. Im Fachwort heißt das SMED: internes und externes Rüsten trennen und so viel wie möglich nach extern verlagern. Am Band sage ich lieber: Was du vorher machen kannst, mach vorher. Und danach schauen wir gemeinsam, wie der Rest im Stillstand schneller geht.`,
 '„SMED heißt Single Minute Exchange of Die, nach Shigeo Shingo …“ – am Band verliert dich das sofort.','„Was du vorher machen kannst, mach vorher – dann steht die Anlage kürzer.“',
 'Und was machst du mit dem Teil, der nur im Stillstand geht? (Straffen: parallel arbeiten, feste Reihenfolge, schnellere Verbindungen.)',
 'Zwei Sorten Arbeit: nur im Stillstand – oder auch bei laufender Anlage. Alles, was geht, vorher.',true);

Q('q06','fach','Welche Verschwendungsarten kennst du – und welche hast du beim Rüsten gesehen?',
 'Ob du die 7+1 Arten kennst und sie in echter Arbeit wiedererkennst – nicht nur als Liste.',
 ['Die Liste kurz: sieben plus eine.','Zwei, drei davon an Anlage A zeigen – sauber benannt.','Satz dazu: Sehen ist wichtiger als auswendig können.'],
 `Die klassischen sieben sind Transport, Bestand, Bewegung, Warten, Überproduktion, Überbearbeitung und Fehler. Dazu kommt oft als achte das ungenutzte Potenzial der Mitarbeiter. Beim Rüsten an Anlage A habe ich vor allem Warten gesehen: Die Maschine stand, und alle haben auf die Schlosser oder den Werkzeugwagen gewartet. Dann Bewegung: Werkzeug holen und unnötiges Hantieren, während die Anlage steht. Tätigkeiten ohne Bezug zum Produkt im Stillstand sind nicht wertschöpfend: Die Maschine wartet, die Leute laufen und hantieren. Überbearbeitung wäre etwas anderes, nämlich mehr Aufwand, als der Kunde verlangt. Und dass viele externe Arbeiten im Stillstand liefen, ist eigentlich ein SMED-Thema: Die Arbeit ist nötig, sie liegt nur zur falschen Zeit. Ungenutztes Potenzial gab es auch: Die Kollegen wussten oft selbst, wo es hakt. Das kam in der Rüstauswertung raus, als wir die Abweichungen gemeinsam angeschaut haben. Die Liste auswendig ist nicht der Punkt. Der Punkt ist, sie an der Anlage zu sehen.`,
 'Die Liste runterbeten – ohne ein einziges Beispiel.','„Warten habe ich an Anlage A bei jedem Wechsel gesehen: Die Maschine stand, alle warteten auf die Schlosser.“',
 'Welche Verschwendung ist am schwersten zu sehen – und warum?',
 '7+1 Muda. Anlage A: Warten (Schlosser, Wagen – und die Maschine wartet bei Tätigkeiten ohne Produktbezug), Bewegung (Hantieren); externe Arbeit im Stillstand = SMED-Thema.');

Q('q07','fach','Wie gehst du ein Problem strukturiert an – PDCA, A3, was nutzt du?',
 'Ob du strukturiert vorgehst oder sofort Lösungen umsetzt – und ob du den Kreis schließt (prüfen und festschreiben).',
 ['PDCA in einem Satz.','Ein eigenes Beispiel entlang der vier Schritte – nicht nur Rüsten.','A3 = dasselbe auf einem Blatt – ehrlich sagen, ob du schon eins gemacht hast.'],
 `Ich gehe im Kern nach PDCA vor: planen, machen, prüfen, festigen. Ein Beispiel, das nicht vom Rüsten kommt: [ergänzen: eine Übergabe – z. B. ein Problem bei der Schichtübergabe, das immer wieder auftrat]. Davor steht die Ist-Aufnahme: aufschreiben, was genau passiert und wie oft. Plan heißt dann: Ursachen finden und Maßnahmen festlegen, bevor ich etwas ändere. Do: eine Maßnahme im Kleinen ausprobieren, zum Beispiel erst in einer Schicht. Check: nach ein paar Wochen nachschauen, ob es wirklich besser ist – nicht nur, ob die Maßnahme umgesetzt wurde. Act: Wenn es wirkt, gehört es in den Standard. Wenn nicht, fange ich mit dem Plan neu an. Beim Rüsten an Anlage A lief es genauso: Abweichungen vom Rüstdrehbuch aufschreiben, in der Rüstauswertung mit dem Team Maßnahmen ableiten und in den nächsten Auswertungen prüfen. Ein A3 ist für mich dasselbe auf einem Blatt: Problem, Ist-Zustand, Ursache, Maßnahmen, Nachverfolgung. Ein formales A3 habe ich [ergänzen: schon geschrieben? Wenn nein, ehrlich sagen].`,
 '„Ich habe sofort die Lösung gesehen und umgesetzt.“','„Erst aufgeschrieben, dann im Kleinen ausprobiert – und danach geprüft, ob es wirklich wirkt.“',
 'Was machst du, wenn der Check zeigt, dass es nicht wirkt?',
 'Ist aufnehmen → Plan: Ursachen + Maßnahmen → Do: klein ausprobieren → Check: wirkt es? → Act: Standard oder neu planen.');

Q('q08','fach','Nenne ein Problem, das du mit 5-Why gelöst hast.',
 'Ob du bis zur Ursache gehst oder beim ersten Symptom stoppst – und ob du ehrlich bist, wenn du die Methode nicht formal genutzt hast.',
 ['Ehrlich: formal oder nur so vorgegangen?','Die Warum-Kette an Anlage A.','Daraus die Maßnahme – und dein Merksatz.'],
 `Formal mit einem 5-Why-Blatt habe ich das nicht gemacht, das sage ich ehrlich. Aber so bin ich an Anlage A vorgegangen. Warum dauert der Formatwechsel so lange? Weil die Maschine lange steht, ohne dass gerüstet wird. Warum steht sie? Weil wir auf Werkzeug warten. Warum warten wir? Weil der Werkzeugwagen erst kommt, wenn die Maschine schon steht. Warum kommt er so spät? [deine Erfahrung ergänzen: keiner zuständig, kein fester Platz, nicht im Rüstdrehbuch?] Die Maßnahme: Der Wagen wird vor den Auslauf gezogen, bevor die Maschine stoppt. Das Gleiche bei den Schlossern: Warum kamen sie spät? Weil sie bei anderen Aufträgen waren. Warum? Weil Rüsten für sie keine Priorität hatte. Also haben wir sie fest eingeplant. Mein Merksatz: nicht bei der ersten Antwort stehen bleiben. „Die Schlosser sind halt langsam“ ist keine Ursache.`,
 'Bei einem Schuldigen aufhören: „Der Kollege hat nicht aufgepasst.“','„Wenn die Antwort ein Name ist, habe ich zu früh aufgehört zu fragen.“',
 'Wann reicht 5-Why nicht mehr? (Wenn es mehrere Ursachen gibt – dann erst sammeln, z.B. mit Ishikawa.)',
 'Lange Rüstzeit → Warten auf Werkzeug → Wagen kommt zu spät → Wagen vor den Auslauf.');

Q('q09','fach','Was ist Standardarbeit – und wie stellst du sicher, dass ein Standard hält?',
 'Ob du weißt, dass ein Standard gelebt, geprüft und von der Führung getragen werden muss – nicht nur geschrieben.',
 ['Definition in einem Satz: beste bekannte Art, heute.','Beispiel Rüstdrehbuch an Anlage A.','Drei Dinge, damit es hält – inklusive deiner Lehre.'],
 `Standardarbeit ist für mich die beste Art, wie wir etwas heute machen – aufgeschrieben, damit jede Schicht es gleich macht. Und sie ist die Basis für Verbesserung: Ohne Standard weiß ich gar nicht, was eine Abweichung ist. An Anlage A war das Rüstdrehbuch unser Standard. Ich habe aufgeschrieben, wo wir davon abweichen, und das in der Rüstauswertung besprochen. Damit ein Standard hält, braucht es für mich drei Dinge. Erstens: Die Schicht muss ihn mitgebaut haben, sonst ist es meiner und nicht ihrer. Zweitens: Jemand schaut regelmäßig drauf – bei uns war das die Rüstauswertung. Drittens, und da habe ich gelernt: Die Führung muss ihn tragen. Ich habe die Vorgesetzten zu spät eingebunden, da hing der Standard zu sehr an mir. Heute würde ich den Meister von Anfang an mitnehmen, damit er den Standard einfordert, auch wenn ich nicht da bin.`,
 '„Wir haben eine Arbeitsanweisung geschrieben und ausgehängt.“','„Ein Standard hält, wenn die Schicht ihn mitgebaut hat und der Meister ihn einfordert.“',
 'Woran merkst du, dass ein Standard nicht mehr gelebt wird?',
 'Standard hält, wenn die Schicht ihn mitbaut, jemand regelmäßig prüft und die Führung ihn trägt.',true);

Q('q10','fach','Shopfloor-Management: Was ist für dich gut – und was ist nur ein Board?',
 'Ob du Shopfloor-Management als Führung vor Ort verstehst – nicht als Board mit bunten Zetteln.',
 ['Was es ist: kurze Runde, wenige Kennzahlen, Maßnahmen mit Name und Termin.','Was schlecht läuft: Board ohne Folgen.','Dein kleines Beispiel: Rüstauswertung – und was gefehlt hat.'],
 `Gutes Shopfloor-Management heißt für mich: Führung findet da statt, wo gearbeitet wird. Eine kurze, feste Runde am Board, wenige Kennzahlen, die die Schicht selbst versteht, und bei jeder Abweichung eine Maßnahme mit Namen und Termin. Wenn die Schicht es nicht lösen kann, geht es eine Ebene höher. Das Board ist nur das Werkzeug. Schlecht wird es, wenn das Board gepflegt wird, aber keiner mehr hinschaut, was daraus folgt. Unsere Rüstauswertung an Anlage A war im Kleinen so etwas: Wir haben die Abweichungen angeschaut und Maßnahmen abgeleitet. Eine gute Runde erkenne ich daran, dass am Ende jeder weiß, wer bis wann was macht. Als Lean Consultant würde ich lieber mit einem Board anfangen, das wirklich genutzt wird, als mit fünf, die keiner pflegt. [deine Erfahrung ergänzen: Welche Boards kennst du, und was passiert dort?]`,
 '„Wir brauchen an jeder Linie ein KPI-Board.“','„Lieber ein Board, das genutzt wird, als fünf, die keiner pflegt.“',
 'Welche drei Kennzahlen würdest du an eine Linie hängen – und warum?',
 'Führung vor Ort: kurze Runde, wenige Kennzahlen, Maßnahme mit Name und Termin. Das Board ist nur Werkzeug.');

Q('q11','fach','Was bedeutet 5S für dich – ohne Aufräum-Klischee?',
 'Ob du 5S als Voraussetzung für stabile Abläufe siehst – oder als Aufräumaktion vor einem Besuch.',
 ['Die fünf S kurz.','Wozu: nicht suchen, Abweichungen sofort sehen.','Beispiel beim Rüsten – und: immer an ein echtes Problem hängen.'],
 `5S sind Sortieren, Setzen – also feste Plätze –, Säubern, Standardisieren und Selbstdisziplin, also dranbleiben. Für mich ist 5S kein Aufräumen für den nächsten Besuch. Es geht darum, dass man nicht suchen muss und Abweichungen sofort sieht. Beim Rüsten merkt man das direkt: Wenn Werkzeug nicht da ist oder erst gesucht werden muss, steht die Anlage. An Anlage A war der Werkzeugwagen dafür ein gutes Beispiel – nicht, weil wir offiziell 5S eingeführt hätten, sondern weil der Wagen einen festen Platz vor dem Auslauf bekommen hat und da ist, bevor die Maschine stoppt. [deine Erfahrung ergänzen: Gibt es auf dem Wagen feste Plätze pro Werkzeug? Wenn ja, sagen.] Ich würde 5S immer an ein echtes Problem hängen, zum Beispiel Suchzeiten beim Wechsel. Dann versteht jeder, warum es sich lohnt, und es schläft nicht nach vier Wochen wieder ein.`,
 '„Wir haben 5S eingeführt.“ – ohne Ergebnis.','„Der Werkzeugwagen steht vor dem Auslauf, bevor die Maschine stoppt – dann steht die Anlage nicht, weil jemand sucht.“',
 'Wie hältst du 5S am Leben, wenn der erste Schwung vorbei ist?',
 '5S heißt: nicht suchen, Abweichungen sofort sehen – immer an ein echtes Problem hängen.');

Q('q12','praxis','Erzähl ein Rüstprojekt so, dass jemand ohne Produktionshintergrund die Wirkung versteht.',
 'Ob du Wirkung ohne Fachsprache erklären kannst – für Werkleitung, Personal, Controlling.',
 ['Bild für Laien: Maschine wird auf ein anderes Produkt umgebaut.','Was schieflief und was ihr geändert habt – drei Maßnahmen.','Ergebnis ehrlich (Range, Quelle) + was es fürs Werk heißt + Lehre.'],
 `Stell dir vor, eine Maschine muss auf ein anderes Produkt umgebaut werden. An Anlage A hat so ein Formatwechsel rund 8 Stunden gedauert. Viel davon lief im Stillstand, obwohl man es vorher hätte machen können. Der Werkzeugwagen kam oft erst, wenn die Maschine schon stand, und die Schlosser hatten Rüsten nicht als Priorität. Ich habe die Abweichungen vom Rüstdrehbuch aufgeschrieben und in der Rüstauswertung mit dem Team besprochen. Dann haben wir den Wagen vor den Auslauf gezogen, die Schlosser fest eingeplant und die Pausen so gelegt, dass sie nicht mehr mitten in den Wechsel fallen. Danach waren wir meistens bei 3 bis 5 Stunden – ohne Stoppuhr-Studie, aber in den Rüstauswertungen sichtbar. Fürs Werk heißt das: Bei jedem Wechsel steht die Anlage mehrere Stunden weniger still. Und die Maßnahmen kamen aus der Runde, nicht nur von mir.`,
 '„Wir haben die Rüstzeit um 50 Prozent reduziert.“ – klingt genau, ist aber nicht gemessen.','„Von rund 8 auf meistens 3 bis 5 Stunden – sichtbar in den Rüstauswertungen.“',
 'Wie viele Wechsel waren das, über welchen Zeitraum – und was war der schlechteste? [Antwort vorher klären – nichts erfinden]',
 'Anlage A: rund 8 → meistens 3–5 h. Wagen vorher da, Schlosser eingeplant, Pausen nicht im Wechsel.',true);

Q('q13','praxis','Wie misst du Erfolg, wenn es keine sauberen Daten gibt?',
 'Ob du ehrlich mit Unsicherheit umgehst und trotzdem Wirkung belegen kannst.',
 ['Ehrlich: Was gab es an Daten, was nicht.','Range + Quelle statt Scheingenauigkeit.','Was du nächstes Mal von Anfang an misst – und was man bis dahin beobachten kann.'],
 `Genau so war es an Anlage A. Eine Stoppuhr-Studie gab es nicht, formales OEE-Tracking auch nicht. Was es gab, waren die Rüstauswertungen und das Schichtbuch. Daraus konnte ich sagen: vorher rund 8 Stunden, danach meistens 3 bis 5, je nach Format und Schicht. Wie viele Wechsel das genau waren, kann ich nicht sauber sagen – [deine Erfahrung ergänzen: grobe Anzahl und Zeitraum, nur wenn du es weißt]. Ich sage deshalb lieber eine Range und die Quelle als eine glatte Zahl, die beim ersten Nachfragen kippt. Als Consultant würde ich beim nächsten Mal von Anfang an eine einfache Messung einbauen: bei jedem Wechsel Start und Ende aufschreiben, vom letzten Gutteil bis zum ersten Gutteil. Das kostet fast nichts und macht das Ergebnis belastbar. Und bis die Zahlen da sind, zählt, was man beobachten kann: Steht der Wagen vor dem Stopp da? Sind die Schlosser zur geplanten Zeit an der Maschine?`,
 '„Wir haben ungefähr 40 Prozent gespart.“ – ohne Quelle.','„Rund 8 auf meistens 3 bis 5 Stunden. Quelle: Rüstauswertungen, keine Stoppuhr-Studie.“',
 'Warum hast du damals nicht gemessen?',
 'Range + Quelle + was nicht gemessen wurde. Nächstes Mal: einfache Messung von Anfang an.');
Q('q14','praxis','Hält der Standard an Anlage A heute noch – auch ohne dich?',
 'Der Härtetest: Nachhaltigkeit. Ob du ehrlich bist und weißt, woran ein Standard hängt.',
 ['Ehrlicher Ist-Stand (nur was du weißt).','Was trägt – was wackelt.','Lehre: Führung früher einbinden.'],
 `Ehrlich: [deine Erfahrung ergänzen: Wie sieht es heute an Anlage A aus? Wer macht die Rüstauswertung jetzt?] Was ich sagen kann: Die Maßnahmen, die im Ablauf fest drin sind, halten am ehesten. Wenn die Schlosser fest eingeplant sind und der Wagen vor dem Auslauf steht, ist das Teil der Planung und nicht mehr meine Erinnerung. Wo es wackeln kann, ist alles, was davon lebt, dass jemand drauf schaut – zum Beispiel, dass Abweichungen vom Rüstdrehbuch weiter aufgeschrieben und besprochen werden. Das hing stark an mir. Genau daraus kommt meine wichtigste Lehre: Ich hätte die Vorgesetzten früher einbinden müssen, damit sie den Standard einfordern, auch wenn ich nicht da bin. Als Lean Consultant würde ich von Anfang an klären, wer den Standard nach mir trägt. Und ich würde nach ein paar Wochen wiederkommen und nachschauen, statt nur mit dem Start zufrieden zu sein.`,
 '„Ja, läuft alles super.“ – wenn du es nicht geprüft hast.','„Was im Ablauf fest drin ist, hält. Was an mir hing, wackelt – das würde ich heute anders machen.“',
 'Warst du seitdem noch mal an der Maschine und hast nachgeschaut?',
 'Was im Ablauf verankert ist, hält; was an mir hing, wackelt. Deshalb: Führung früher einbinden.');

Q('q15','praxis','Welche Verschwendung hast du lange übersehen?',
 'Selbstreflexion: ob du zugeben kannst, dass auch du betriebsblind warst – und was du daraus gelernt hast.',
 ['Konkretes Beispiel.','Warum du es nicht gesehen hast.','Was du seitdem anders machst.'],
 `Die Arbeiten im Stillstand. An Anlage A liefen viele Tätigkeiten, während die Maschine stand, die man vorher oder nachher hätte machen können – Werkzeug holen, Teile bereitlegen. Und es gab Tätigkeiten, die mit dem Produkt gar nichts zu tun hatten und trotzdem im Wechsel passiert sind. Das war für mich lange normal, weil es immer so gemacht wurde. Ich habe das erst gesehen, als ich die Abweichungen vom Rüstdrehbuch aufgeschrieben habe. Auf dem Papier sieht man plötzlich, wie viel Zeit weg ist, bevor überhaupt ein Formatteil getauscht wird. Seitdem frage ich bei jedem Schritt: Muss die Maschine dafür stehen? Wenn nein, gehört es nicht in den Stillstand. Und ich bin vorsichtiger, wenn ich denke, ich kenne einen Ablauf schon. Gerade als Interner muss ich genau hinschauen, weil ich vieles für selbstverständlich halte.`,
 '„Eigentlich habe ich alles gesehen.“','„Die Arbeiten im Stillstand waren für mich lange normal – bis ich sie aufgeschrieben habe.“',
 'Wie verhinderst du, dass dir das an einer neuen Linie wieder passiert?',
 'Arbeiten im Stillstand, die vorher gehen – lange normal, erst beim Aufschreiben sichtbar.');

Q('q16','widerstand','Wie gehst du mit Widerstand bei Kollegen um?',
 'Ob du Widerstand ernst nimmst und Leute gewinnst – statt Druck zu machen oder über ihn hinwegzugehen.',
 ['Widerstand hat meistens einen Grund – zuhören.','Beispiel Anlage A: Skepsis und dein Satz.','Beteiligen statt überzeugen – und Führung dazu.'],
 `Widerstand hat meistens einen Grund. An Anlage A kam oft: „Das bringt eh nichts.“ Die Kollegen hatten schon einige Aktionen gesehen, die wieder eingeschlafen sind. Also habe ich nicht mit Methode angefangen, sondern mit dem, was sie selbst nervt: das Warten auf Werkzeug und auf die Schlosser. Ich habe es klein gemacht: Nicht das große Projekt zählt, sondern jeder Fehler, den wir beim nächsten Wechsel finden. Dann haben wir die Abweichungen gemeinsam in der Rüstauswertung besprochen. Die Maßnahmen kamen dann aus der Runde und nicht nur von mir. Wenn der Kollege seinen eigenen Vorschlag umgesetzt sieht, ist der Widerstand meistens kleiner. Und ich hole den Meister dazu: Wenn er sichtbar dahintersteht, müssen die Kollegen nicht zwischen mir und ihm wählen. [deine Erfahrung ergänzen: ein Kollege, der am Ende mitgezogen hat – ohne Namen]`,
 '„Die muss man halt mitnehmen.“ – Floskel ohne Inhalt.','„Ich fange bei dem an, was die Kollegen selbst nervt – und die Maßnahmen kommen aus ihrer Runde.“',
 'Und wenn jemand trotzdem blockiert?',
 'Widerstand hat Gründe. Mit dem anfangen, was die Kollegen nervt; Maßnahmen aus der Runde; Meister dazu.',true);

Q('q17','widerstand','Ein erfahrener Kollege sagt: „Das bringt eh nichts.“ Was antwortest du?',
 'Ob du ruhig bleibst, ein gutes Argument hast und den Kollegen einbindest statt ihn zu überreden.',
 ['Nicht diskutieren – Verständnis zeigen.','Dein Satz.','Ihn einbinden: Was würdest du ändern?'],
 `Ich würde erst mal nicht dagegen argumentieren. Wenn jemand das sagt, hat er meistens schon Aktionen gesehen, die wieder eingeschlafen sind. Das nehme ich ernst. Dann sage ich, was ich an Anlage A auch gesagt habe: „Jeder Defekt oder jede Verbesserung, die wir beim Rüsten finden, bringt uns einen Schritt näher an eine störungsfreie Maschine.“ Es geht also nicht um ein großes Projekt, sondern um den nächsten gefundenen Fehler. Und dann frage ich ihn: „Was nervt dich beim Wechsel am meisten?“ Erfahrene Kollegen wissen oft am besten, wo es hakt. An Anlage A waren das zum Beispiel die Wartezeiten auf Werkzeug und auf die Schlosser. Wenn sein Punkt in der Rüstauswertung auftaucht und dann wirklich umgesetzt wird, hat er selbst den Beweis, dass es etwas bringt. Überzeugen muss ich ihn dann nicht mehr.`,
 '„Doch, Lean bringt nachweislich viel.“ – Belehrung.','„Was nervt dich beim Wechsel am meisten? Da fangen wir an.“',
 'Und wenn er auch nach der ersten Maßnahme sagt, es bringt nichts?',
 'Ernst nehmen, nicht dagegen argumentieren – meinen Satz für Skeptiker sagen, dann fragen: „Was nervt dich beim Wechsel am meisten?“');

Q('q18','widerstand','Wie coachst du, ohne anzuordnen?',
 'Ob du den Rollenwechsel verstehst: Als Consultant hast du keine Weisungsbefugnis – du wirkst über Fragen und Beteiligung.',
 ['Fragen statt Antworten.','Leute ihr Ergebnis selbst vorstellen lassen.','Beispiel Rüstauswertung – und ehrlich, was du noch lernst.'],
 `Als Consultant kann ich nichts anordnen, und das finde ich eigentlich richtig. Ich arbeite mit Fragen: Was ist beim letzten Wechsel passiert? Wo habt ihr gewartet? Was müsste da sein, bevor die Maschine stoppt? So kommt die Lösung aus der Schicht, und dann trägt die Schicht sie auch. An Anlage A war die Rüstauswertung so ein Ort: Wir haben die Abweichungen vom Rüstdrehbuch angeschaut, und die Maßnahmen kamen aus der Runde. Wichtig ist mir auch, dass die Kollegen ihr Ergebnis selbst vorstellen, zum Beispiel dem Meister, und nicht ich. Ehrlich gesagt: Als Vertretung des Vorarbeiters war ich es gewohnt, auch mal zu sagen, wie es gemacht wird. Das Umschalten aufs Fragen muss ich bewusst üben. [deine Erfahrung ergänzen: eine Situation, in der du die Antwort bewusst nicht vorgegeben hast]`,
 '„Ich erkläre den Leuten, wie es richtig geht.“','„Ich frage, bis die Schicht die Lösung selbst hat – und dann stellt sie sie auch selbst vor.“',
 'Was machst du, wenn die Schicht auf eine schlechte Lösung kommt?',
 'Fragen statt Antworten; die Schicht stellt ihr Ergebnis selbst vor.');

Q('q19','widerstand','Was machst du, wenn ein Meister nicht mitzieht?',
 'Ob du mit Hierarchie umgehen kannst: nicht über ihn hinweg, nicht sofort eskalieren, sondern sein Problem verstehen.',
 ['Erst verstehen: Was ist sein Problem, seine Kennzahl?','Ihm etwas bringen, das ihm hilft – er ist der Besitzer.','Erst dann, offen und mit ihm, eine Ebene höher.'],
 `Zuerst würde ich zu ihm gehen und verstehen, warum. Ein Meister hat seine eigenen Ziele: Menge, Qualität, Personal. Wenn ich mit einem Lean-Thema komme, ist das für ihn erst mal Zusatzarbeit. Das kenne ich von der anderen Seite: [ergänzen: ein Tag als Vertretung des Vorarbeiters, an dem jemand mit einem neuen Thema kam, während du die Schicht am Laufen halten musstest]. Also frage ich: Was drückt dich gerade am meisten? Wenn ich dabei helfen kann, ist es sein Thema und nicht meins. Und er bekommt das Ergebnis, nicht ich. Wichtig: Ich gehe nicht an ihm vorbei zu seiner Schicht. Dann müssten die Kollegen zwischen ihm und mir wählen, und das verliere ich immer. Wenn er trotzdem blockiert, sage ich ihm offen, dass ich das mit dem gemeinsamen Vorgesetzten kläre. Nicht hinter seinem Rücken, sondern mit ihm zusammen, als Frage: Was braucht der Bereich, damit es klappt?`,
 '„Dann eskaliere ich das an die Werkleitung.“ – als erster Schritt.','„Ich frage ihn, was ihn am meisten drückt – und mache es zu seinem Thema.“',
 'Und wenn der Vorgesetzte dem Meister recht gibt?',
 'Erst sein Problem verstehen, es zu seinem Thema machen; nie an ihm vorbei; Eskalation nur offen.',true);

Q('q20','politik','Produktion und Instandhaltung ziehen nicht an einem Strang. Wie gehst du vor?',
 'Ob du Schnittstellenkonflikte sachlich lösen kannst – ohne Schuldzuweisung.',
 ['Beide Seiten verstehen – Schlosser haben andere Aufträge.','Beispiel: Rüsten fest einplanen.','Gemeinsame Planung statt Vorwurf.'],
 `Das hatte ich genau so an Anlage A. Die Schlosser haben Rüsten nicht priorisiert, weil sie gleichzeitig andere Aufträge hatten. Für die Produktion sah das aus wie „die kommen nicht“. Für die Instandhaltung war es: „Wir haben noch drei andere Baustellen.“ Beide hatten recht. Die Lösung war nicht, Druck zu machen, sondern die Schlosser für den Wechsel fest einzuplanen. Dann wussten sie vorher, wann sie gebraucht werden, und konnten ihre anderen Aufträge drum herum legen. Das ist für mich der Kern bei Schnittstellen: Das Problem liegt meistens nicht bei einer Person, sondern in der Planung zwischen zwei Bereichen. Als Consultant würde ich beide an einen Tisch holen, mit einem konkreten Fall, und fragen: Was braucht ihr voneinander, damit es klappt? [deine Erfahrung ergänzen: Wer hat die feste Einplanung damals entschieden – Meister, Instandhaltungsleitung?]`,
 '„Die Instandhaltung hat halt keine Lust.“','„Das Problem lag in der Planung zwischen zwei Bereichen – nicht bei den Schlossern.“',
 'Was machst du, wenn die Instandhaltungsleitung sagt, dafür hat sie keine Leute?',
 'Schnittstelle Schlosser: beide hatten recht – Lösung war feste Einplanung, nicht Druck.');

Q('q21','politik','Eine Führungskraft sagt Ja zum Standard – lebt ihn aber nicht. Was tust du?',
 'Ob du verstehst, dass ein Standard ohne sichtbare Führung stirbt – und wie du Führung gewinnst, ohne sie vorzuführen.',
 ['Offen, unter vier Augen ansprechen.','Konkrete, kleine Rolle anbieten.','Deine Lehre aus Anlage A.'],
 `Das ist für mich der wichtigste Punkt überhaupt, weil ich es an Anlage A selbst gelernt habe. Ich habe die Vorgesetzten zu spät eingebunden. Die Maßnahmen haben funktioniert, aber der Standard hing zu sehr an mir. Wenn eine Führungskraft Ja sagt und es nicht lebt, spreche ich sie unter vier Augen an – nicht vor der Schicht. Ich sage, was ich beobachte, und frage, was sie braucht. Oft fehlt keine Überzeugung, sondern Zeit oder eine klare Rolle. Dann schlage ich etwas Kleines und Konkretes vor, zum Beispiel: einmal pro Woche bei der Rüstauswertung dabei sein und nach einer offenen Maßnahme fragen. Das kostet wenig, und die Schicht sieht: Der Chef schaut hin. Wenn sich trotzdem nichts ändert, spreche ich das offen im nächsten Termin mit ihr und ihrem Vorgesetzten an – als Frage, wie wir den Standard absichern, nicht als Vorwurf.`,
 '„Dann muss man halt mehr kontrollieren.“','„Ich biete ihr eine kleine, sichtbare Rolle an – zum Beispiel einmal pro Woche bei der Auswertung dabei sein.“',
 'Wie sprichst du das an, wenn die Führungskraft über dir steht?',
 'Unter vier Augen ansprechen, kleine sichtbare Rolle anbieten – Standard braucht Führung.');

Q('q22','tage90','Was machst du in deinen ersten 90 Tagen?',
 'Ob du einen realistischen Plan hast: erst sehen und verstehen, dann ein sichtbarer Pilot mit dem Bereich, dann Standard – statt alles auf einmal.',
 ['Woche 1–2: Gemba – an die Linien, vor allem an die, die du nicht kennst.','Ab Woche 3: Pilot mit einem Meister an einem Thema, das ihn drückt.','Bis Tag 90: Standard, Meister als Besitzer, Messung – dann das nächste Thema.'],
 `In den ersten zwei Wochen bin ich vor allem am Gemba, also da, wo gearbeitet wird. Und zwar gerade an den Linien, die ich noch nicht kenne. Meine eigene Linie kenne ich, da bin ich eher betriebsblind. Ich laufe Schichten mit, schaue mir Wechsel und Störungen live an und frage Meister und Bediener: Wo verliert ihr am meisten? Dazu schaue ich, welche Zahlen es wirklich gibt und welche Themen das Lean-Team schon hat. [ergänzen: Mit wem würdest du zuerst sprechen – Rollen, keine Namen?] Ab Woche drei starte ich einen Piloten mit einem Meister, an einem Thema, das ihn selbst drückt. Nicht fünf Baustellen, sondern eine, bei der man nach ein paar Wochen etwas sieht. Messung plane ich diesmal von Anfang an ein, auch wenn es nur Start und Ende auf einem Zettel ist. Bis Tag 90 geht es darum, dass es hält: Standard festhalten, der Meister ist der Besitzer, eine feste Runde schaut drauf. Dann kommt das nächste Thema.`,
 '„Ich würde sofort überall SMED einführen.“','„Erst zwei Wochen an die Linien, vor allem an die, die ich nicht kenne – ab Woche 3 ein Pilot mit einem Meister.“',
 'Was, wenn dir die Führung schon in Woche 2 ein Großprojekt gibt?',
 '2 Wochen Gemba (v. a. Linien, die ich nicht kenne) → ab Woche 3 Pilot mit einem Meister → bis Tag 90 Standard + Übergabe. Messung von Anfang an.',true);

Q('q23','tage90','Wie würdest du an eine Linie rangehen, die du nicht kennst?',
 'Ob dein Vorgehen übertragbar ist – oder ob du nur Rüsten an Anlage A kannst.',
 ['Erst hingehen und schauen, bevor du Lösungen hast.','Mit den Leuten sprechen: Wo hakt es?','Kleines Thema, messen, Standard.'],
 `Zuerst würde ich hingehen und zuschauen – ohne Lösung im Kopf. Eine Schicht mitlaufen, einen Wechsel oder eine Störung live sehen. Dann mit dem Meister und den Bedienern sprechen: Was nervt euch am meisten? Wo verliert ihr Zeit? Die Leute an der Linie wissen das meistens. Danach schaue ich, welche Zahlen es gibt: Stillstände, Ausschuss, Rüstzeiten, was auch immer da ist. Und dann suche ich mit dem Meister ein Thema aus, klein genug, dass man in ein paar Wochen etwas sieht. Mein Vorgehen an Anlage A lässt sich übertragen: aufschreiben, wo es vom Standard abweicht, mit dem Team besprechen, Maßnahmen ableiten, prüfen. Was ich nicht mache: am ersten Tag mit einer fertigen Lösung kommen. Ich kenne die Linie nicht – und die Kollegen merken sofort, wenn jemand sie nicht kennt, aber schon weiß, was zu tun ist.`,
 '„Ich würde erst mal eine Wertstromanalyse machen.“ – bevor du mit einem Menschen gesprochen hast.','„Erst eine Schicht mitlaufen und fragen, was nervt – dann mit dem Meister ein kleines Thema aussuchen.“',
 'Woran erkennst du nach einer Schicht, wo die größte Verschwendung liegt?',
 'Hingehen, zuschauen, fragen, was nervt; vorhandene Zahlen; kleines Thema mit dem Meister.');

Q('q24','schwach','Was ist deine größte Schwäche – oder dein größtes Lernfeld?',
 'Selbstreflexion mit echtem Beispiel – und was du konkret dagegen tust.',
 ['Echte Schwäche mit Beispiel.','Was es gekostet hat.','Was du heute anders machst + zweites Lernfeld (Methode).'],
 `Ich will Dinge oft selbst lösen und gebe zu spät ab. Das merke ich vor allem, wenn es eng wird. Ein Beispiel: [ergänzen: ein Tag als Vertretung oder eine Übergabe, bei der du lieber selbst gemacht hast, statt es einem Kollegen zu übergeben – was ist passiert?] Kurzfristig ging das gut. Aber der Kollege hat dabei nichts gelernt, und beim nächsten Mal stand ich wieder selbst da. Als Lean Consultant wäre das genau falsch, weil meine Arbeit ja ist, dass andere es können. Was ich heute mache: Ich frage mich bei jeder Aufgabe, wer sie eigentlich machen sollte, und lasse ihn machen, auch wenn es langsamer geht. Ein zweites Lernfeld ist die Methode. Vieles, was ich beim Rüsten gemacht habe, war im Kern SMED und PDCA, aber ich habe es nicht so genannt und nicht formal dokumentiert. [ergänzen: was du dafür schon tust – Kurs, Buch, Lean-Team begleiten] Das muss ich als Consultant sauber können, damit andere es nachmachen können.`,
 '„Ich bin zu perfektionistisch.“','„Ich gebe zu spät ab – kurzfristig geht es, aber der Kollege lernt nichts dabei.“',
 'Woran würden wir in sechs Monaten merken, dass du daran gearbeitet hast?',
 'Ich gebe zu spät ab → andere lernen nicht mit. Heute: fragen, wer es machen sollte, und machen lassen. Plus: Methode formal lernen.',true);

Q('q25','schwach','Erzähl von etwas, das nicht geklappt hat.',
 'Ob du Misserfolge ehrlich erzählen kannst – ohne Ausrede und ohne dich kleinzumachen – und was du daraus machst.',
 ['Was nicht geklappt hat – konkret.','Warum (deine Anteile).','Was du daraus gemacht hast.'],
 `Was an Anlage A nur halb geklappt hat, war die Absicherung. Die Maßnahmen haben gewirkt, die Wechsel waren danach meistens bei 3 bis 5 Stunden statt rund 8. Aber der Standard hing zu sehr an mir. Die Abweichungen vom Rüstdrehbuch aufschreiben und besprechen, das lief vor allem, weil ich drangeblieben bin. Mein Anteil daran: Ich habe die Vorgesetzten zu spät eingebunden. Sie waren informiert, aber sie haben den Standard nicht selbst eingefordert. Und gemessen habe ich auch nicht sauber, eine Stoppuhr-Studie gab es nicht. [deine Erfahrung ergänzen: ein konkreter Moment, an dem du gemerkt hast, dass es ohne dich wackelt] Daraus habe ich zwei Dinge mitgenommen. Erstens: Führung von Anfang an rein, der Meister ist der Besitzer. Zweitens: Messung vorher einplanen, auch wenn es nur Start und Ende pro Wechsel auf einem Zettel ist. Genau das würde ich als Consultant von Tag eins an machen.`,
 '„Eigentlich hat alles geklappt.“ – oder: Schuld bei anderen.','„Die Maßnahmen haben gewirkt – aber abgesichert habe ich den Standard zu spät. Das war mein Anteil.“',
 'Wie hast du reagiert, als du gemerkt hast, dass es wackelt?',
 'Halb geklappt: Maßnahmen wirkten, aber Standard hing an mir und Messung fehlte – mein Anteil.');

Q('q26','rueck','Hast du noch Fragen an uns?',
 'Ob du dich ernsthaft mit der Rolle beschäftigt hast – und ob du an Wirkung denkst, nicht an Vorteile.',
 ['Zwei bis drei echte Fragen zur Rolle.','Mindestens eine zu Erfolg / Erwartungen.','Keine Fragen zu Urlaub, Homeoffice, Gehalt als erste Frage. Anrede im Gespräch so wie bei euch üblich.'],
 `Ja, drei Fragen habe ich. Erstens: Woran würdet ihr nach einem Jahr merken, dass die Stelle gut besetzt ist? Ich möchte wissen, woran ich gemessen werde. Zweitens: Mit welchem Bereich oder welcher Linie würde ich wahrscheinlich anfangen, und gibt es da schon ein Thema, das drückt? Dann kann ich mich vorbereiten und muss nicht bei null anfangen. Und drittens: Wie arbeitet das Lean-Team mit den Meistern zusammen – eher auf Anfrage aus den Bereichen, oder mit festen Themen von der Werkleitung? Das ist mir wichtig, weil ich an Anlage A gelernt habe, dass ein Standard nur hält, wenn die Führung ihn trägt. Wenn noch Zeit ist, würde ich gern wissen, [deine Erfahrung ergänzen: eine eigene Frage, z. B. zur Einarbeitung oder zu Schulungen]. Danke, dass ihr euch die Zeit genommen habt.`,
 '„Nein, eigentlich ist alles klar.“ – oder als erste Frage: „Wie ist das mit Homeoffice?“','„Woran würdet ihr nach einem Jahr merken, dass die Stelle gut besetzt ist?“',
 'Warum ist dir das wichtig?',
 'Immer 2–3 Fragen: Erfolg nach 1 Jahr? Startbereich? Zusammenarbeit Lean-Team ↔ Meister?');
