/* ===== Interview-Modus: Lean & TPM Consultant · Lebensmittelhersteller (Stellen-Fragen, Sie-Form) ===== */
Q('t01','j_tpm','Was sind die 8 Säulen von TPM – und mit welcher fangen Sie an?',
 'Ob Sie TPM als System kennen – nicht nur „Bediener machen sauber“ – und ob Sie sinnvoll priorisieren, statt alle acht gleichzeitig zu starten.',
 ['Die 8 Säulen kurz aufzählen (Fundament: 5S).','Begründen, warum man nicht alle auf einmal startet.','Start: autonome + geplante Instandhaltung an einer Pilotanlage, gezielt an den größten Verlusten.'],
 `TPM steht für mich auf acht Säulen, mit 5S als Fundament. Erstens autonome Instandhaltung – die Bediener reinigen, inspizieren und schmieren selbst. Zweitens geplante Instandhaltung. Drittens fokussierte Verbesserung, also Kobetsu Kaizen an den größten Verlusten. Viertens Qualitätsinstandhaltung: Anlagenzustände so halten, dass keine Fehler entstehen. Fünftens Anlaufmanagement, Early Equipment Management – Erfahrungen fließen in neue Anlagen. Sechstens Training und Ausbildung. Siebtens TPM in administrativen Bereichen. Achtens Arbeitssicherheit und Umwelt. Anfangen würde ich nicht mit allen acht. Ich würde an einer Pilotanlage mit autonomer und geplanter Instandhaltung starten und mit fokussierter Verbesserung die größten Verluste angehen – welche das sind, zeigt die OEE-Verlustanalyse. [deine Erfahrung ergänzen: Wo hast du Teile davon schon erlebt?]`,
 '„TPM heißt, die Bediener machen die Wartung selbst.“','„Acht Säulen, Fundament 5S – gestartet wird an einer Pilotanlage mit autonomer und geplanter Instandhaltung, gezielt an den größten Verlusten.“',
 'Welche Säule wird in der Praxis am häufigsten vernachlässigt – und warum?',
 '8 Säulen: AM · geplante IH · Kobetsu Kaizen · Qualitäts-IH · Anlaufmanagement (EEM) · Training · Administration · Sicherheit/Umwelt. Fundament 5S. Start: Pilotanlage, AM + geplante IH.',true);
Q('t02','j_tpm','Erklären Sie die autonome Instandhaltung – welche 7 Schritte gibt es?',
 'Ob Sie die Stufenlogik kennen und wissen, dass Schritt 1 (Grundreinigung) schon Inspektion ist – und wie man Bediener mitnimmt.',
 ['Ziel in einem Satz: Bediener kennen und pflegen ihre Anlage.','Die 7 Schritte in Reihenfolge.','Praxis: Grundreinigung + Mängelkarten, CIL-Standard, Audit nach jedem Schritt.'],
 `Ziel ist, dass die Bediener ihre Anlage so gut kennen, dass sie Abweichungen früh sehen – und kleine Pflege selbst machen. Die sieben Schritte: Eins, Grundreinigung – und Reinigen heißt Inspizieren, dabei hängen wir Mängelkarten an. Zwei, Verschmutzungsquellen und schwer zugängliche Stellen beseitigen. Drei, vorläufige Standards für Reinigen, Inspizieren und Schmieren, also CIL. Vier, Gesamtinspektion: Die Bediener lernen die Anlagenfunktionen, etwa Pneumatik oder Antriebe. Fünf, autonome Inspektion – die Bediener prüfen selbstständig. Sechs, Standardisieren und Organisieren, zum Beispiel Ersatzteile und Arbeitsplatz. Sieben, autonomes Management – das Team verbessert selbst. Jeder Schritt endet mit einem kurzen Audit, erst dann geht es weiter. In der Lebensmittelproduktion stimme ich die Reinigung zusätzlich mit den Hygienevorgaben ab.`,
 '„Die Bediener übernehmen einfach die Wartung von der Instandhaltung.“','„Schritt 1 ist Grundreinigung – und Reinigen heißt Inspizieren: Jede gefundene Abweichung bekommt eine Mängelkarte.“',
 'Wie verhindern Sie, dass die Instandhaltung das als Stellenabbau versteht?',
 'AM 7 Schritte: Grundreinigung · Verschmutzungsquellen · CIL-Standards · Gesamtinspektion · autonome Inspektion · Standardisieren · autonomes Management. Audit nach jedem Schritt.');
Q('t03','j_tpm','Rechnen Sie: Eine Abfülllinie hat 480 min geplante Zeit, 60 min Stillstand, 90 % Leistung und 98 % Gutteile. Wie hoch ist die OEE – und was tun Sie damit?',
 'Ob Sie OEE sicher rechnen können und danach nicht bei der Zahl stehen bleiben, sondern auf den größten Verlust zeigen.',
 ['Verfügbarkeit: 420 / 480 = 87,5 %.','OEE = 0,875 × 0,90 × 0,98 ≈ 77 %.','Deutung: größter Hebel ist die Verfügbarkeit – Stillstand nach Ursachen aufschlüsseln; Definition klären.'],
 `Verfügbarkeit: 480 Minuten geplant, 60 stehen, also 420 durch 480 – das sind 87,5 Prozent. Leistung 90, Qualität 98 Prozent. OEE ist das Produkt: 0,875 mal 0,9 mal 0,98, das sind rund 77 Prozent. Die Zahl allein sagt mir aber noch nicht, was ich tun soll. Der größte Verlust liegt hier in der Verfügbarkeit, 12,5 Prozentpunkte. Also würde ich die 60 Minuten aufschlüsseln: Wie viel ist Sortenwechsel und Reinigung, wie viel sind Störungen? Ist es der Wechsel, setze ich mit SMED an. Sind es Störungen, schaue ich mit der Instandhaltung auf MTBF und die häufigsten Ausfallursachen. Und ich kläre vorher, wie wir OEE definieren – zum Beispiel, ob geplante Reinigung als Stillstand zählt. Sonst vergleichen wir Äpfel mit Birnen.`,
 '„OEE = Verfügbarkeit + Leistung + Qualität, im Schnitt also 92 %.“','„0,875 × 0,9 × 0,98 ≈ 77 % – der größte Hebel ist die Verfügbarkeit, also schlüssle ich den Stillstand nach Ursachen auf.“',
 'Zählen Sie geplante Reinigung (z. B. CIP) als Verlust oder rechnen Sie sie raus?',
 'V = 420/480 = 87,5 % · OEE = 0,875 × 0,90 × 0,98 ≈ 77 %. Größter Hebel: Verfügbarkeit → Stillstand aufschlüsseln. Definition vorher klären.',true);
Q('t04','j_tpm','Sie kommen neu an eine Linie. Welche Kennzahlen schauen Sie sich zuerst an?',
 'Ob Sie fokussiert vorgehen (wenige, aussagekräftige Kennzahlen) und Zahlen mit dem Blick vor Ort verbinden.',
 ['OEE mit Verlustaufteilung (V × L × Q) – wo geht die Zeit hin?','Top-Stillstandsgründe als Pareto, MTBF/MTTR, Rüst-/Reinigungszeit beim Sortenwechsel.','Plus Ausschuss und Sicherheit – dann selbst an die Linie: stimmen die Zahlen?'],
 `Zuerst die OEE – aber nicht nur die eine Zahl, sondern aufgeteilt: Verliert die Linie in Verfügbarkeit, Leistung oder Qualität? Dann die häufigsten Stillstandsgründe, als Pareto. Bei einer Linie mit vielen Sorten schaue ich mir die Rüst- und Reinigungszeiten beim Sortenwechsel an. Für die Technik MTBF und MTTR: Fällt die Anlage oft aus, oder dauert die Reparatur lange? Dazu Ausschuss und Nacharbeit – und Arbeitssicherheit, die kommt immer zuerst. Dann gehe ich an die Linie und schaue, ob die Zahlen zur Realität passen. Gerade Kurzstillstände tauchen in vielen Erfassungen gar nicht auf. Lieber drei Kennzahlen, die stimmen und besprochen werden, als zwanzig auf einem Board.`,
 '„Ich würde erst mal ein umfassendes KPI-Dashboard aufbauen.“','„OEE aufgeteilt nach Verlusten, Top-Stillstandsgründe, Rüstzeiten – und dann an die Linie, ob die Zahlen stimmen.“',
 'Was machen Sie, wenn die Daten erkennbar falsch erfasst werden?',
 'OEE nach V/L/Q · Pareto Stillstände · Rüst-/Reinigungszeit · MTBF/MTTR · Ausschuss · Sicherheit. Danach Gemba: stimmen die Zahlen?',true);
Q('t05','j_tpm','Was sind die 6 großen Verluste – und wie hängen sie mit der OEE zusammen?',
 'Ob Sie Verluste den drei OEE-Faktoren zuordnen können – die Basis jeder Verlustanalyse.',
 ['Verfügbarkeit: Störungen/Ausfälle, Rüsten & Einrichten.','Leistung: Leerlauf & Kurzstillstände, reduzierte Geschwindigkeit.','Qualität: Anlaufverluste, Ausschuss/Nacharbeit – mit Beispiel aus der Abfüllung.'],
 `Die sechs großen Verluste verteilen sich auf die drei OEE-Faktoren. Verfügbarkeit: erstens Störungen und Ausfälle, zweitens Rüsten und Einrichten – in der Lebensmittelproduktion gehört der Sortenwechsel mit Reinigung dazu. Leistung: drittens Leerlauf und Kurzstillstände, etwa wenn ein Becher am Einlauf hängt und der Bediener ihn kurz löst; viertens reduzierte Geschwindigkeit, wenn die Linie unter Nenntakt gefahren wird. Qualität: fünftens Anlaufverluste nach Wechsel oder Schichtstart, sechstens Ausschuss und Nacharbeit, zum Beispiel unterfüllte Packungen oder falsch bedruckte Etiketten. Kurzstillstände unterschätzt man am meisten, weil sie einzeln harmlos wirken und oft nicht erfasst werden.`,
 'Die sechs Verluste aufzählen, ohne sie Verfügbarkeit, Leistung und Qualität zuzuordnen.','„Kurzstillstände unterschätzt man am meisten – einzeln harmlos, in Summe oft ein großer Leistungsverlust.“',
 'Wie würden Sie Kurzstillstände erfassen, wenn die Anlage sie nicht automatisch meldet?',
 'V: Störungen, Rüsten · L: Kurzstillstände, reduzierte Geschwindigkeit · Q: Anlaufverluste, Ausschuss/Nacharbeit.');
Q('t06','j_tpm','Was sagen MTBF und MTTR – und was tun Sie, wenn die MTTR hoch ist?',
 'Ob Sie Instandhaltungskennzahlen verstehen und daraus unterschiedliche Maßnahmen ableiten.',
 ['MTBF = Laufzeit / Anzahl Ausfälle (wie oft?). MTTR = Reparaturzeit / Anzahl Ausfälle (wie lange?).','Hohe MTTR: Ersatzteile, Werkzeug, Anleitung, Erreichbarkeit der Techniker.','Niedrige MTBF: Ursachen abstellen – geplante IH, AM, Kobetsu Kaizen.'],
 `MTBF ist die mittlere Zeit zwischen zwei Ausfällen – Laufzeit geteilt durch Anzahl Ausfälle. Sie sagt: Wie oft fällt die Anlage aus? MTTR ist die mittlere Reparaturdauer: Wie lange dauert es, bis sie wieder läuft? Ein Beispiel: 600 Stunden Laufzeit, 12 Ausfälle, das sind 50 Stunden MTBF. 18 Stunden Reparatur insgesamt, also 1,5 Stunden MTTR. Ist die MTTR hoch, schaue ich auf die Reaktionskette: Ist das Ersatzteil da, ist der Techniker schnell erreichbar, gibt es eine Fehleranleitung, findet man das Werkzeug? Vieles davon ist Organisation, nicht Technik – ähnlich wie beim Rüsten an Anlage A, wo die Schlosser nicht eingeplant waren. Ist die MTBF niedrig, geht es um Ursachen: geplante Instandhaltung, autonome Instandhaltung und gezielte Verbesserung.`,
 '„MTBF und MTTR sind Instandhaltungsthemen, da halte ich mich raus.“','„Hohe MTTR ist oft Organisation – Ersatzteil, Werkzeug, Erreichbarkeit –, nicht Technik.“',
 'Welche der beiden Kennzahlen würden Sie zuerst verbessern – und warum?',
 'MTBF = Laufzeit / Ausfälle (wie oft) · MTTR = Reparaturzeit / Ausfälle (wie lange). 600 h / 12 = 50 h; 18 h / 12 = 1,5 h.');
Q('t07','j_tpm','Ein Sortenwechsel mit Allergen-Reinigung dauert zu lange. Wie gehen Sie vor?',
 'Ob Sie SMED auf die Lebensmittelproduktion übertragen – ohne bei Hygiene und Allergenmanagement Abstriche zu machen.',
 ['Ist aufnehmen: Wechsel mitlaufen, intern vs. extern trennen.','Externes vor den Stopp (Material, Reinigungsmittel, Formatteile, Freigabeformular); Reinigung parallel, fester Ablauf.','Nie an Hygiene/Freigabe sparen – Sortenreihenfolge planen (allergenfrei → allergenhaltig), QS früh einbinden.'],
 `Zuerst würde ich einen Wechsel live mitlaufen, am besten mit dem Team, und jeden Schritt aufschreiben: Was geht nur bei stehender Linie, was ginge vorher? So haben wir an Anlage A den Formatwechsel von rund 8 auf meistens 3 bis 5 Stunden gebracht. Beim Sortenwechsel heißt das zum Beispiel: Reinigungsmittel, Formatteile, Verpackungsmaterial und Freigabeformular stehen bereit, bevor die Linie stoppt. Die Reinigung selbst kann man oft mit zwei Personen parallel und in fester Reihenfolge machen. Was ich nie kürze, sind Hygiene und Allergenfreigabe – da hole ich die Qualitätssicherung von Anfang an dazu. Einen großen Hebel sehe ich in der Planung: Sorten so reihen, dass zum Beispiel allergenfreie vor allergenhaltigen Produkten laufen. Dann braucht man seltener die volle Reinigung.`,
 '„Die Reinigung können wir doch kürzer machen, da sparen wir am meisten.“','„An Hygiene und Allergenfreigabe spare ich nie – ich ziehe die Vorbereitung vor den Stopp und plane die Sortenreihenfolge mit.“',
 'Wie überzeugen Sie die Produktionsplanung, die Reihenfolge zu ändern?',
 'SMED beim Sortenwechsel: intern/extern trennen, Vorbereitung vor den Stopp, Reinigung parallel + Standard. Hygiene/Allergenfreigabe nie kürzen; Reihenfolge planen, QS einbinden.',true);
Q('t08','j_tpm','Wie sieht gutes Shopfloor-Management im Mehrschichtbetrieb aus?',
 'Ob Sie eine Regelkommunikation über Schichten und Ebenen aufbauen können – mit KPI-Board, Eskalation und Maßnahmen.',
 ['Kaskade: Schichtrunde an der Linie → Bereichsrunde → Werksrunde, fester Takt, kurz.','Board: wenige Kennzahlen (Sicherheit, Qualität, OEE/Stillstände), Maßnahmen mit Name/Termin, Eskalation.','Schichtübergabe als Standard; die Führung moderiert, nicht der Consultant.'],
 `Für mich ist das eine feste Kaskade. An jeder Linie gibt es zu Schichtbeginn eine kurze Runde am Board, zehn Minuten im Stehen: Sicherheit, Qualität, Ausbringung oder OEE und die größten Stillstände der letzten Schicht. Was die Schicht nicht selbst lösen kann, wird eskaliert – in die Bereichsrunde und von dort, wenn nötig, in die Werksrunde. Jede Maßnahme bekommt einen Namen und einen Termin. Wichtig im Mehrschichtbetrieb ist die Übergabe: Die Nachtschicht muss wissen, was die Spätschicht begonnen hat, sonst fängt jede Schicht von vorne an. Moderieren soll die Führungskraft, nicht ich. Ich helfe am Anfang, das Format aufzubauen, coache die Meister und ziehe mich dann zurück. An Anlage A war die Rüstauswertung im Kleinen so eine Runde – gefehlt hat damals die Führung darin.`,
 '„Wir hängen an jede Linie ein KPI-Board mit allen Kennzahlen.“','„Kurze Runde je Schicht, wenige Kennzahlen, Maßnahmen mit Name und Termin – und eine klare Eskalation.“',
 'Woran erkennen Sie, dass eine Shopfloor-Runde nur noch Ritual ist?',
 'Kaskade Linie → Bereich → Werk · Board: Sicherheit, Qualität, OEE/Stillstände · Maßnahmen Name + Termin · Eskalation · Schichtübergabe · Führung moderiert.');
Q('a01','j_auf','Wie würden Sie TPM in einem Werk ausrollen?',
 'Ob Sie eine realistische Rollout-Logik haben: klein beweisen, dann skalieren – und wie Sie Führung und Instandhaltung einbinden.',
 ['Vorbereitung: Ziel, Verlustanalyse, Lenkungskreis, Rollen (Produktion + Instandhaltung).','Pilotanlage → Modelllinie: an einer Engpass-Anlage zeigen, dass es wirkt; dort entstehen Standards und Trainings.','Ausrollen in Wellen mit Multiplikatoren, Audits, Shopfloor-Runden – Tempo nach Reife.'],
 `Ich würde in drei Stufen vorgehen. Erstens Vorbereitung: Mit der Werkleitung klären, welches Ziel wir verfolgen, eine Verlustanalyse machen und einen kleinen Lenkungskreis mit Produktion und Instandhaltung bilden. Zweitens eine Pilotanlage – am besten eine Engpass-Linie mit sichtbaren Verlusten und einem Meister, der will. Dort machen wir die ersten Schritte der autonomen Instandhaltung, CIL-Standards, ein Board, und messen die OEE vorher und nachher. Wenn es wirkt, wird daraus die Modelllinie: Dort entstehen Standards, Trainings und Audits, und andere Teams können sich das anschauen. Drittens das Ausrollen in Wellen, Linie für Linie, mit Multiplikatoren aus dem Pilotteam. Das Tempo richtet sich danach, wie gut die Standards halten – nicht nach dem Projektplan. Gelernt habe ich an Anlage A: Führungskräfte von Anfang an einbinden, sonst hält es nicht.`,
 '„Ich würde TPM gleichzeitig an allen Linien starten, damit es schnell geht.“','„Pilotanlage → Modelllinie → Ausrollen in Wellen – das Tempo bestimmt die Reife der Standards, nicht der Projektplan.“',
 'Wie wählen Sie die Pilotanlage aus?',
 'Vorbereitung (Ziel, Verlustanalyse, Lenkungskreis) → Pilotanlage (Engpass, williger Meister) → Modelllinie (Standards, Trainings, Audits) → Ausrollen in Wellen mit Multiplikatoren.',true);
Q('a02','j_auf','Wie gestalten Sie einen TPM-Workshop?',
 'Ob Sie Workshops praxisnah, an der Anlage und ergebnisorientiert planen – nicht als Folien-Schulung.',
 ['Vorher: Ziel, Anlage, Teilnehmer (Bediener aller Schichten, Instandhaltung, Meister), Daten, Sicherheit/Hygiene klären.','Ablauf: kurze Einführung → an die Anlage (Grundreinigung, Mängelkarten) → sortieren → Maßnahmen + CIL-Entwurf.','Abschluss: Das Team präsentiert selbst; Maßnahmen mit Name/Termin, Nachfassen.'],
 `Ein TPM-Workshop findet bei mir vor allem an der Anlage statt, nicht im Besprechungsraum. Vorher kläre ich mit dem Meister Ziel und Anlage, wer teilnimmt – Bediener aus allen Schichten, ein Instandhalter, der Meister – und alles zu Sicherheit und Hygiene, also Freischaltung und Reinigungsvorgaben. Der Ablauf, zum Beispiel über zwei Tage: eine halbe Stunde Einführung, warum wir das machen und was die Anlage verliert. Dann gemeinsame Grundreinigung, jede Abweichung bekommt eine Mängelkarte. Danach sortieren wir: Was können die Bediener selbst beheben, was braucht die Instandhaltung? Daraus entstehen Maßnahmen und ein erster Entwurf für den Reinigungs-, Inspektions- und Schmierstandard. Am Ende stellt das Team sein Ergebnis selbst vor, idealerweise vor der Bereichsleitung. Und ganz wichtig: ein Termin zum Nachfassen nach vier Wochen. [deine Erfahrung ergänzen: Workshop, den du schon moderiert oder mitgemacht hast]`,
 '„Ich mache eine Schulung mit Präsentation über die TPM-Theorie.“','„Der Workshop findet an der Anlage statt – das Team findet die Mängel selbst und stellt sein Ergebnis selbst vor.“',
 'Was machen Sie, wenn im Workshop 80 Mängelkarten zusammenkommen?',
 'Vorbereiten (Ziel, Team, Sicherheit/Hygiene) → kurze Einführung → Grundreinigung + Mängelkarten → sortieren → Maßnahmen + CIL-Entwurf → Team präsentiert → Nachfassen.',true);
Q('a03','j_auf','Wie sind Sie Widerstand von Führungskräften bei einer Einführung begegnet? (STAR)',
 'Verhaltensfrage: Ob Sie ein echtes Beispiel strukturiert erzählen (Situation, Aufgabe, Handlung, Ergebnis) – und was Sie daraus gelernt haben.',
 ['S/T: Anlage A, Vorgesetzte sahen es als „dein Thema“; deine Aufgabe.','A: verstanden, was sie drückt, Kosten pro Stunde Wechsel gezeigt, Entscheidung zur Schlosser-Einplanung bei der Führung geholt.','R + Lehre: 8 h → meistens 3–5 h; heute Führung vom ersten Tag an als Besitzer.'],
 `Situation: An Anlage A hat ein Formatwechsel rund 8 Stunden gedauert. Meine Aufgabe als Rüstoptimierer war, das zu verkürzen. Die Vorgesetzten waren nicht dagegen, aber sie haben es als mein Thema gesehen – nach dem Motto: Mach mal. [ergänzen: konkrete Situation, z. B. ein Satz eines Vorgesetzten] Handlung: Ich habe erst verstanden, was sie drückt – Ausbringung und Personal. Dann habe ich ihnen die Abweichungen aus der Rüstauswertung gezeigt und erklärt, was jede Stunde Wechsel an Ausbringung kostet. Und ich habe darum gebeten, die Schlosser fest für den Wechsel einzuplanen – das konnte nur die Führung entscheiden. Ergebnis: Wir sind von rund 8 auf meistens 3 bis 5 Stunden gekommen. Meine Lehre: Ich habe die Führung zu spät eingebunden. Heute mache ich den Meister vom ersten Tag an zum Besitzer und gebe ihm eine sichtbare Rolle.`,
 '„Widerstand hatte ich eigentlich nie.“ – oder ein Beispiel ohne eigenes Handeln.','„Ich habe erst verstanden, was die Führung drückt – und das Thema dann zu ihrem gemacht.“',
 'Was hätten Sie getan, wenn der Vorgesetzte klar Nein gesagt hätte?',
 'STAR: Anlage A · Führung sah es als „dein Thema“ · verstanden, was sie drückt, Kosten pro Stunde Wechsel gezeigt, Schlosser-Einplanung durch Führung · 8 → 3–5 h · Lehre: Führung früher einbinden.',true);
Q('a04','j_auf','Wie planen und steuern Sie eine Lean- oder TPM-Initiative?',
 'Ob Sie Projektlogik beherrschen: Ziel, Messgröße, Plan, Verantwortliche, Nachverfolgung – und Ergebnisse berichten.',
 ['Ziel und Messgröße mit Ausgangswert (z. B. OEE, Wechselzeit).','A3 als Ein-Blatt-Steuerung; Auftraggeber, Team, echte Zeit klären.','Wöchentliche Maßnahmenrunde; nach Abschluss prüfen, ob es hält.'],
 `Ich starte mit einem klaren Ziel und einer Messgröße mit Ausgangswert – zum Beispiel der Wechselzeit an einer Linie oder der OEE. Ohne Ausgangswert kann ich später nichts belegen; das habe ich an Anlage A gelernt, wo wir nur die Rüstauswertungen hatten. Dann bringe ich alles auf ein A3: Hintergrund, Ist, Ziel, Ursachen, Maßnahmen, Nachverfolgung. Das ist gleichzeitig mein Steuerungsinstrument gegenüber der Führung. Ich kläre, wer Auftraggeber ist, wer im Team ist und wie viel Zeit die Leute tatsächlich haben. Gesteuert wird über eine kurze wöchentliche Runde mit der Maßnahmenliste – Name, Termin, Status. Und nach dem Abschluss prüfe ich nach ein paar Wochen, ob das Ergebnis hält. Erst dann ist die Initiative für mich fertig.`,
 '„Ich setze die Maßnahmen um, die offensichtlich sind.“','„Ziel mit Ausgangswert, alles auf einem A3, wöchentliche Maßnahmenrunde – und nach ein paar Wochen prüfen, ob es hält.“',
 'Wie gehen Sie damit um, wenn die Leute für das Projekt keine Zeit bekommen?',
 'Ziel + Messgröße mit Ausgangswert → A3 → Rollen/Ressourcen → wöchentliche Maßnahmenrunde → Nachhaltigkeit prüfen.');
Q('a05','j_auf','Wie entwickeln Sie einen Standard, der in allen Schichten hält?',
 'Ob Sie Standards gemeinsam mit den Schichten entwickeln, visuell halten und über Führung und Audits absichern.',
 ['Mit Vertretern aller Schichten erarbeiten – beste bekannte Methode.','Einfach und visuell: Fotos, Ein-Punkt-Lektionen, direkt an der Anlage.','Absichern: Training, regelmäßige Prüfung durch die Führung, Abweichungen in die Runde, verbessern.'],
 `Ein Standard hält, wenn die Leute ihn mitgebaut haben. Deshalb hole ich aus jeder Schicht jemanden dazu – sonst ist es der Standard der Frühschicht, und die Nachtschicht macht es weiter auf ihre Art. Wir schreiben auf, was heute am besten funktioniert, und halten es einfach: Fotos, wenige Schritte, direkt an der Anlage. Für einzelne Handgriffe nutze ich Ein-Punkt-Lektionen. Dann trainieren wir alle Schichten und lassen es die Leute einmal vormachen. Abgesichert wird über die Führung: Der Meister prüft regelmäßig an der Linie, ob der Standard gelebt wird, und Abweichungen kommen in die Shopfloor-Runde. Und ein Standard ist nie fertig: Findet jemand einen besseren Weg, wird er angepasst. An Anlage A war das Rüstdrehbuch so ein Standard – was im Ablauf fest drin war, hat gehalten; was an mir hing, hat gewackelt.`,
 '„Ich schreibe eine Arbeitsanweisung und hänge sie aus.“','„Ein Standard hält, wenn alle Schichten ihn mitgebaut haben und der Meister ihn regelmäßig an der Linie prüft.“',
 'Wie gehen Sie mit einer Schicht um, die den Standard bewusst nicht einhält?',
 'Alle Schichten bauen mit · einfach + visuell (Fotos, Ein-Punkt-Lektion) · trainieren · Führung prüft regelmäßig · verbessern.');
Q('a06','j_auf','Erzählen Sie von einer Optimierung, die Sie selbst umgesetzt haben. (STAR)',
 'Ob Sie Wirkung mit ehrlichen Zahlen belegen und Ihren eigenen Beitrag klar vom Teamergebnis trennen.',
 ['S/T: Anlage A, Formatwechsel rund 8 h, deine Rolle.','A: Abweichungen aufgeschrieben, Rüstauswertung, drei Maßnahmen (Werkzeugwagen, Schlosser, Pausen).','R: meistens 3–5 h (Quelle Rüstauswertungen, keine Stoppuhr) + Übertrag auf Sortenwechsel.'],
 `Situation: An Anlage A hat ein Formatwechsel rund 8 Stunden gedauert. Aufgabe: Als Rüstoptimierer sollte ich das verkürzen. Handlung: Ich habe bei den Wechseln die Abweichungen vom Rüstdrehbuch aufgeschrieben und in der Rüstauswertung mit dem Team besprochen. Daraus kamen drei Maßnahmen: Der Werkzeugwagen steht vor dem Auslauf, bevor die Maschine stoppt. Die Schlosser sind fest für den Wechsel eingeplant. Und die Pausen liegen nicht mehr im Wechsel. Ergebnis: Wir sind von rund 8 auf meistens 3 bis 5 Stunden gekommen, je nach Format und Schicht. Quelle sind die Rüstauswertungen, eine Stoppuhr-Studie gab es nicht. Übertragen auf eine Lebensmittellinie heißt das: Bei jedem Sortenwechsel zuerst schauen, was vor den Stopp gezogen werden kann.`,
 '„Wir haben die Rüstzeit um 50 Prozent reduziert.“ – ohne Quelle.','„Von rund 8 auf meistens 3 bis 5 Stunden – laut Rüstauswertungen, keine Stoppuhr-Studie.“',
 'Was war Ihr eigener Anteil – und was hat das Team gemacht?',
 'STAR Anlage A: 8 h → meistens 3–5 h (Rüstauswertungen). Wagen vor den Auslauf, Schlosser eingeplant, Pausen raus aus dem Wechsel.',true);
Q('a07','j_auf','Eine Führungskraft sieht Lean nur als Sparprogramm. Wie beraten Sie sie?',
 'Ob Sie Führungskräfte auf Augenhöhe beraten und Lean als Führungssystem erklären – nicht als Kostensenkung.',
 ['Ernst nehmen: Kosten sind ein legitimes Ziel.','Umdeuten: Verluste senken statt Leute – jeder OEE-Punkt am Engpass ist Ausbringung.','Ihre Rolle zeigen: Gemba, Shopfloor-Runde, Fragen stellen – Start an ihrem Problem.'],
 `Ich würde ihr erst mal nicht widersprechen – Kosten sind ein berechtigtes Ziel. Aber ich würde den Blick verschieben: Lean spart nicht an den Leuten, sondern an den Verlusten. Jeder OEE-Punkt an einer Engpasslinie ist mehr Ausbringung mit denselben Leuten und Anlagen. Merken die Leute dagegen, dass Lean Stellen kostet, macht keiner mehr mit – und dann ist auch das Sparziel weg. Danach würde ich ihr eine konkrete Rolle anbieten: einmal pro Woche mit mir an die Linie, an der Shopfloor-Runde teilnehmen, Fragen stellen statt Lösungen vorgeben. Und wir starten mit einem Thema, das sie selbst drückt – etwa einem Engpass oder einer Linie mit vielen Störungen –, damit sie früh ein Ergebnis sieht.`,
 '„Dann erkläre ich ihr, dass sie Lean falsch verstanden hat.“','„Lean spart an den Verlusten, nicht an den Leuten – jeder OEE-Punkt am Engpass ist mehr Ausbringung.“',
 'Und wenn sie trotzdem Stellen abbauen will?',
 'Ernst nehmen → Verluste statt Leute (OEE am Engpass = Ausbringung) → Rolle anbieten (Gemba, Runde) → Start an ihrem Problem.');
Q('a08','j_auf','Wie schulen Sie Bediener – zum Beispiel für Reinigen, Inspizieren, Schmieren?',
 'Ob Sie Training praxisnah und nachhaltig gestalten (TPM-Säule Training & Ausbildung) – mit Qualifizierungsnachweis.',
 ['An der Anlage, kleine Gruppen; Ein-Punkt-Lektionen mit Fotos.','Vormachen – nachmachen – selbst machen; später schulen Bediener Bediener.','Punkte markieren, CIL-Rundgang mit Checkliste, Qualifikationsmatrix.'],
 `Ich schule an der Anlage, nicht im Raum, und in kleinen Gruppen aus allen Schichten. Für jeden Punkt gibt es eine Ein-Punkt-Lektion: ein Blatt mit Foto – was prüfen, woran erkenne ich gut oder schlecht, womit schmieren, wie oft. Der Ablauf ist einfach: Ich mache es vor, der Bediener macht es nach, dann macht er es allein und ich schaue zu. Die Reinigungs-, Inspektions- und Schmierpunkte markieren wir an der Anlage, zum Beispiel mit Farbpunkten, und es gibt einen kurzen Rundgang pro Schicht mit Checkliste. In der Lebensmittelproduktion achte ich darauf, dass Schmierstoffe und Reinigungsmittel zu den Hygienevorgaben passen. Wer qualifiziert ist, kommt in die Qualifikationsmatrix – und die Besten schulen später ihre Kollegen. So hängt das Wissen nicht an mir.`,
 '„Ich mache eine PowerPoint-Schulung für alle Bediener.“','„Vormachen, nachmachen, selbst machen – an der Anlage, mit Ein-Punkt-Lektion und Qualifikationsmatrix.“',
 'Wie stellen Sie sicher, dass der CIL-Rundgang auch in der Nachtschicht gemacht wird?',
 'An der Anlage, kleine Gruppen · Ein-Punkt-Lektionen · vormachen–nachmachen–selbst machen · Punkte markieren, CIL-Rundgang · Qualifikationsmatrix.');
Q('p01','j_prof','Warum diese Stelle – und warum unser Unternehmen?',
 'Ob Sie sich mit dem Unternehmen beschäftigt haben und eine echte Verbindung zwischen Ihrer Erfahrung und der Stelle herstellen – ohne Floskeln.',
 ['Die Stelle: Lean + TPM – genau dein Weg von Anlage A (Rüsten + Schlosser = Instandhaltung).','Das Unternehmen: 1–2 konkrete Punkte aus deiner Recherche [ergänzen].','Was du beitragen willst: Sortenwechsel, Verluste, Leute befähigen.'],
 `Die Stelle verbindet genau die zwei Dinge, die mich an Anlage A gepackt haben: Abläufe verbessern – und die Zusammenarbeit von Produktion und Instandhaltung. Wir sind beim Formatwechsel von rund 8 auf meistens 3 bis 5 Stunden gekommen, auch weil die Schlosser fest eingeplant wurden. Das ist im Kleinen schon TPM. Das möchte ich jetzt systematisch machen, an mehreren Linien. Am Unternehmen reizt mich [ergänzen: 1–2 Punkte aus deiner Recherche – z. B. Produkte, die du kennst, Werte oder Nachhaltigkeitsziele von der Website]. Und Lebensmittelproduktion mit vielen Sorten heißt: viele Wechsel, hohe Hygieneanforderungen, Mehrschicht – genau da bringen Lean und TPM viel. Da kann ich vom ersten Tag an etwas beitragen.`,
 '„Sie sind ein bekanntes Unternehmen, und ich suche eine neue Herausforderung.“','„Die Stelle verbindet Abläufe verbessern mit Produktion und Instandhaltung – genau das, was mich an Anlage A gepackt hat.“',
 'Was wissen Sie über unsere Produktion?',
 'Stelle = Lean + TPM = mein Weg von Anlage A. Unternehmen: [2 Punkte aus Recherche]. Lebensmittel: viele Sortenwechsel, Hygiene, Mehrschicht → hier wirke ich.',true);
Q('p02','j_prof','Stellen Sie sich bitte kurz vor – Qualifikation und Erfahrung mit Lean/TPM.',
 'Ob Sie in 1–2 Minuten einen roten Faden erzählen – und ehrlich zu Qualifikation und Lean/TPM-Erfahrung sind (Profil: Techniker/Meister/Studium, mehrjährige Erfahrung).',
 ['Ausbildung/Qualifikation [ergänzen] + Jahre in der Produktion.','Lean/TPM-Praxis: Vorarbeiter-Vertretung, Rüstoptimierer, Anlage A – mit ehrlicher Zahl.','Brücke zur Stelle + was du gerade methodisch ausbaust.'],
 `Mein Name ist Hakan [Nachname ergänzen]. Ich habe [ergänzen: Ausbildung, Techniker-/Meisterqualifikation oder Studium] und arbeite seit [Jahre gesamt ergänzen] Jahren in der Produktion – zwei Jahre davon als Vertretung des Vorarbeiters, eins als Rüstoptimierer. In dieser Rolle haben wir an Anlage A den Formatwechsel von rund 8 auf meistens 3 bis 5 Stunden gebracht – durch feste Abläufe, Vorbereitung vor dem Stopp und feste Einplanung der Instandhaltung. Dabei habe ich gemerkt: Mich interessiert weniger das Schrauben als der Ablauf und die Leute dahinter. Methodisch baue ich gerade aus: [ergänzen: Schulung oder Zertifikat, z. B. Lean-/TPM-Kurs]. Deshalb passt diese Stelle für mich: Lean und TPM systematisch und an mehreren Linien einführen.`,
 '„Ich bin Lean-Experte mit viel Erfahrung in allen Methoden.“','„Ich bin Rüstpraktiker: An Anlage A sind wir von rund 8 auf meistens 3 bis 5 Stunden gekommen – methodisch baue ich gerade aus.“',
 'In der Ausschreibung steht „mehrjährige Erfahrung in Lean/TPM“ – reicht Ihre Erfahrung?',
 '[Qualifikation] + [Jahre] Produktion · Vorarbeiter-Vertretung, Rüstoptimierer · Anlage A 8 → 3–5 h · Methode: [Kurs] · Brücke zur Stelle.');
Q('p03','j_prof','Woran merkt man, dass Sie strukturiert, selbstständig und analytisch arbeiten?',
 'Ob Sie Eigenschaften mit Verhalten belegen statt sie nur zu behaupten.',
 ['Strukturiert: erst Ist aufnehmen (Abweichungen), dann handeln.','Analytisch: Ursachen sortiert, Zahlen ehrlich (Range + Quelle).','Selbstständig: Rüstauswertung selbst aufgebaut und nachverfolgt [zweites Beispiel ergänzen].'],
 `Am besten an Anlage A. Strukturiert heißt bei mir: Ich habe nicht sofort Lösungen umgesetzt, sondern erst bei jedem Wechsel die Abweichungen vom Rüstdrehbuch aufgeschrieben. Analytisch: Aus diesen Notizen haben wir die Ursachen sortiert und gesehen, dass es vor allem Warten war – auf Werkzeug und Schlosser. Und bei den Zahlen bleibe ich ehrlich: rund 8 auf meistens 3 bis 5 Stunden, Quelle Rüstauswertungen, keine Stoppuhr-Studie. Selbstständig: Das Thema hat mir niemand Schritt für Schritt vorgegeben. Ich habe die Rüstauswertung selbst aufgebaut und die Maßnahmen nachverfolgt. [ergänzen: ein zweites Beispiel, z. B. aus der Vertretung des Vorarbeiters]`,
 '„Ich bin sehr strukturiert und analytisch.“ – ohne Beispiel.','„Ich habe erst die Abweichungen aufgeschrieben und Ursachen sortiert – und dann gehandelt.“',
 'Wann haben Sie zuletzt etwas falsch analysiert?',
 'Belegen statt behaupten: Abweichungen aufgeschrieben → Ursachen sortiert → Maßnahmen nachverfolgt; Zahlen mit Range + Quelle.');
Q('p04','j_prof','Wie gut sind Ihre MS-Office-Kenntnisse – wofür nutzen Sie Excel und Co.?',
 'Ob Sie Kennzahlen selbst auswerten und Ergebnisse verständlich aufbereiten können.',
 ['Ehrlich einordnen, was du sicher kannst [ergänzen].','Beispiele: Excel für Stillstands-/Rüstauswertung (Pareto, OEE, Diagramme), Word/PowerPoint für Standards.','Was du ausbaust – und: einfach genug für die Linie.'],
 `Im Alltag nutze ich [ergänzen: was du wirklich sicher kannst – z. B. Excel, Word, PowerPoint, Outlook]. Für Auswertungen arbeite ich mit Excel: Stillstandsgründe sortieren, ein Pareto-Diagramm bauen, OEE aus Zeiten und Stückzahlen rechnen. [ergänzen: z. B. Rüstauswertung in Excel geführt?] Standards und Ein-Punkt-Lektionen schreibe ich in Word oder PowerPoint, mit Fotos von der Anlage. Ehrlich: [ergänzen: was du noch ausbauen willst, z. B. Pivot-Tabellen oder Power BI] will ich vertiefen. Wichtig ist mir: Die Auswertung soll an der Linie verstanden werden. Ein einfaches Diagramm am Board hilft mehr als eine komplizierte Datei, die nur ich lesen kann.`,
 '„MS Office kann ich perfekt.“ – wenn das nicht stimmt.','„Mit Excel rechne ich OEE und baue ein Pareto der Stillstandsgründe – so einfach, dass man es an der Linie versteht.“',
 'Wie würden Sie eine OEE-Auswertung in Excel aufbauen?',
 'Ehrlich einordnen · Excel: Pareto, OEE, Diagramme · Word/PPT: Standards, Ein-Punkt-Lektionen · einfach genug für die Linie.');
Q('p05','j_prof','Erzählen Sie von einem Konflikt im Team und wie Sie ihn gelöst haben. (STAR)',
 'Ob Sie kommunikativ und teamfähig sind – Konflikte sachlich und ohne Schuldzuweisung lösen.',
 ['S/T: Produktion vs. Instandhaltung beim Rüsten (Schlosser nicht eingeplant).','A: beide Seiten angehört, Lücke in der Planung gefunden, gemeinsame Lösung mit den Vorgesetzten.','R: feste Einplanung, kürzere Wechsel; Lehre: Schnittstelle statt Schuld.'],
 `Situation: An Anlage A haben die Schlosser den Formatwechsel nicht priorisiert. Für die Produktion sah das aus wie fehlender Wille, und die Stimmung war entsprechend. Meine Aufgabe war, den Wechsel zu verkürzen – und dafür brauchte ich die Schlosser. Handlung: Ich habe mit beiden Seiten gesprochen. Dabei kam raus: Die Schlosser hatten gleichzeitig andere Aufträge, und niemand hatte den Wechsel bei ihnen eingeplant. Beide hatten also recht. Ich habe vorgeschlagen, die Schlosser fest für den Wechsel einzuplanen, und das mit den Vorgesetzten geklärt. Ergebnis: Das Warten auf die Schlosser fiel weitgehend weg – ein Teil davon, dass wir von rund 8 auf meistens 3 bis 5 Stunden kamen. Gelernt habe ich: Hinter einem Konflikt steckt oft eine Schnittstelle, die keiner geregelt hat.`,
 '„Die Instandhaltung hatte halt keine Lust.“','„Beide hatten recht – das Problem lag in der Planung zwischen zwei Bereichen, nicht bei den Leuten.“',
 'Was machen Sie, wenn Sie selbst Teil des Konflikts sind?',
 'STAR: Schlosser nicht eingeplant → beide Seiten gehört → Planungslücke → feste Einplanung → kürzere Wechsel. Schnittstelle statt Schuld.');
Q('p06','j_prof','Die Stelle verlangt Flexibilität: verschiedene Schichten, Linien, evtl. Standorte. Wie stehen Sie dazu?',
 'Ob Sie Engagement zeigen und realistisch mit Flexibilität umgehen – z. B. auch mal Nachtschicht für einen Rundgang.',
 ['Grundsätzlich ja – du kennst Mehrschicht aus der Produktion.','Fachlich nötig: Standards müssen in allen Schichten halten – also auch nachts da sein.','Ehrlich zu Grenzen und Reisebereitschaft [ergänzen].'],
 `Grundsätzlich bin ich da offen – ich komme aus dem Schichtbetrieb und weiß, wie es nachts an der Linie aussieht. Und ich halte es fachlich für nötig: Ein Standard, den nur die Frühschicht kennt, hält nicht. Deshalb würde ich gerade beim Rollout bewusst auch in Spät- und Nachtschicht an der Linie sein – zum Beispiel bei der Schichtübergabe oder einem CIL-Rundgang. Wenn die Stelle Einsätze an verschiedenen Standorten umfasst, ist das für mich [ergänzen: was für dich realistisch ist, z. B. Tagesfahrten problemlos]. Engagement heißt für mich nicht, immer da zu sein, sondern dafür zu sorgen, dass es auch ohne mich läuft.`,
 '„Flexibilität ist kein Problem, ich mache alles.“ – unrealistisch.','„Ein Standard, den nur die Frühschicht kennt, hält nicht – deshalb bin ich beim Rollout auch nachts an der Linie.“',
 'Wie oft wären Sie bereit, an anderen Standorten zu sein?',
 'Offen, Schichtbetrieb bekannt · Standards in allen Schichten → auch nachts da · Reisen: [realistisch ergänzen] · Engagement = läuft auch ohne mich.');
Q('p07','j_prof','Haben Sie noch Fragen an uns?',
 'Ob Sie sich ernsthaft mit der Rolle beschäftigt haben – und an Wirkung denken, nicht zuerst an Vorteile.',
 ['2–3 Fragen zu Rolle und Erfolg (TPM-Stand, Pilot, Erwartung nach 12 Monaten).','1 Frage zur Zusammenarbeit (Produktion, Instandhaltung, Lean-Team).','Organisatorisches (Einarbeitung, nächste Schritte) zum Schluss.'],
 `Ja, ein paar Fragen habe ich. Erstens: Wo steht das Werk heute mit TPM – gibt es schon eine Pilotanlage, oder geht es um den Start? Zweitens: Woran würden Sie nach zwölf Monaten merken, dass die Stelle gut besetzt ist? Drittens: Wie arbeiten Produktion, Instandhaltung und das Lean-Team heute zusammen – und wer treibt den TPM-Rollout auf Werkleitungsebene? Und zum Schluss: Wie sieht die Einarbeitung aus, und wie geht es nach diesem Gespräch weiter?`,
 '„Nein, alles klar.“ – oder als erste Frage Urlaub, Homeoffice, Gehalt.','„Wo steht das Werk heute mit TPM – gibt es schon eine Pilotanlage?“',
 'Warum ist Ihnen das wichtig?',
 'TPM-Stand/Pilot? · Erfolg nach 12 Monaten? · Zusammenarbeit Produktion–IH–Lean, wer treibt? · Einarbeitung/nächste Schritte.',true);
Q('e01','j_en','Please introduce yourself briefly – in English.',
 'Ob Sie sich auf Englisch flüssig und einfach vorstellen können (Profil: sehr gute Englischkenntnisse). Einfache Sätze schlagen komplizierte.',
 ['Background: years in production, roles.','Key result: changeover on line A, about 8 h → mostly 3–5 h.','Why this role: Lean + TPM on several lines.'],
 `My name is Hakan. I have worked in production for [add years] years – two years as deputy shift supervisor and one year as changeover optimizer. My main project was a format changeover on line A. It used to take about eight hours. Together with the team we brought it down to mostly three to five hours. We prepared the tools before the machine stopped, planned the maintenance technicians into the changeover and moved the breaks out of it. What I learned: the process matters more than working faster. That is why I want this role – to bring Lean and TPM to several lines and help people sustain it themselves.`,
 'Auswendig gelernte, komplizierte Sätze – und bei der ersten Nachfrage ins Stocken geraten.','„Together with the team we brought the changeover down from about eight to mostly three to five hours.“',
 'What was the biggest challenge in that project?',
 'Production [years] · deputy supervisor, changeover optimizer · line A: about 8 h → mostly 3–5 h · want Lean + TPM on several lines.');
Q('e02','j_en','What is OEE – and how would you improve it on a packaging line?',
 'Ob Sie Fachbegriffe auch auf Englisch sicher erklären können.',
 ['OEE = availability × performance × quality.','Find the biggest loss first (Pareto of downtime, minor stops, rejects).','Actions: SMED for product changeovers, autonomous maintenance, standards – measure before/after.'],
 `OEE stands for Overall Equipment Effectiveness. It is availability times performance times quality. For example, 87.5 percent availability, 90 percent performance and 98 percent quality give about 77 percent OEE. To improve it, I first look for the biggest loss. On a packaging line it is often changeovers, minor stops or reduced speed. If changeovers are the problem, I use SMED: everything that can be prepared while the line is running is done before it stops. For minor stops and breakdowns I work with operators and maintenance on autonomous maintenance – cleaning, inspection and lubrication standards. And I always measure before and after, so we know it really works.`,
 '„OEE is a KPI for the machine.“ – ohne Faktoren und ohne Vorgehen.','„First I look for the biggest loss – then I choose the method.“',
 'What is a good OEE value?',
 'Availability × performance × quality · biggest loss first · SMED, autonomous maintenance, standards · measure before/after.');
Q('e03','j_en','How would you convince a production manager who says TPM is just extra work?',
 'Ob Sie auch auf Englisch überzeugend und empathisch argumentieren können.',
 ['Acknowledge: it costs time at the beginning.','Benefit: fewer breakdowns, less firefighting, more output with the same people.','Start small: one pilot line, measure, decide together.'],
 `First I would agree with him: at the beginning TPM does cost time. Cleaning and inspection standards, workshops, training – that is real work. But then I would ask: how much time do we lose today with breakdowns and firefighting? Every small defect an operator finds during cleaning is a breakdown that does not happen at night. So I would suggest starting small: one pilot line, a few weeks, and we measure downtime before and after. If it does not help, we stop. If it helps, he has the result in his own numbers. That usually works better than any presentation.`,
 '„TPM is best practice, so we have to do it.“','„Let us start with one pilot line and measure – if it helps, you have the result in your own numbers.“',
 'What if the pilot shows no improvement after four weeks?',
 'Agree it costs time · ask about today’s losses · start small: pilot line, measure before/after, decide together.');

function nextRank(m){const n=RANKS.find(([v])=>v>m);return n?n[1]+' ab '+n[0]+' MMR':'Höchster Rang';}

 seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9;});}catch(e){}}

/* Kill-Check (Wortsuche, kein KI-Urteil) */
const SPLIT=/(?<=[.!?])(?<!(?:^|[\s(])(?:ca|bzw|z\.B|z\. B|d\.h|u\.a|etc|Nr|ggf|evtl|inkl|vgl)\.)\s+(?=[A-ZÄÖÜ„"0-9])/;
const LINE=/(linie|formatwechsel|wechsel|rüst|maschine|schicht|anlage)/i;
function killCheck(text){const sents=String(text||'').split(/\n+/).flatMap(p=>p.split(SPLIT)).map(s=>s.trim()).filter(Boolean);const out=[];
 KILLS.forEach(k=>{sents.forEach(s=>{let hit=false,ok=false;
  if(k.special==='5s'){if(/\b5\s?s\b/i.test(s)&&!/\d/.test(s.replace(/\b5\s?s\b/ig,'')))hit=true;}
  else if(k.special==='prozent'){if(/\d+([.,]\d+)?\s?(%|prozent)/i.test(s)&&!/(quelle|laut|rüstauswertung|schichtbuch|gemessen|messung)/i.test(s))hit=true;}
  else if(k.re.test(s)){hit=true;if(k.special==='purpose'&&LINE.test(s))ok=true;}
  if(hit)out.push({k,s,ok});});});return out;}
function killHTML(res){if(!res.length)return '<div class="fbbox ok"><b>Keine Kill-Phrase gefunden.</b> Prüf trotzdem: echte Zahl mit Quelle? Konkretes Beispiel?</div>';
 return res.map(r=>r.ok?'<div class="fbbox ok"><span class="badge ok">Erlaubt, weil linienbezogen</span> <b>'+esc(r.k.k)+'</b><br>„'+esc(r.s)+'“</div>':'<div class="fbbox bad"><span class="badge bad">'+esc(r.k.k)+'</span><br>„'+esc(r.s)+'“<br><span class="hint">'+esc(r.k.why)+'</span><br><b>Besser:</b> '+fmt(r.k.repl)+'</div>').join('');}

const KILL_EX=[
 ['Ich sehe mich als Lean-Experte für das ganze Werk.',0],['Meine größte Schwäche ist, dass ich zu perfektionistisch bin.',1],['Ich würde nach dem 8-Stufen-Modell von Kotter vorgehen.',2],

 GOOD=[...new Set(c)].filter(s=>!/\[/.test(s)&&s.length<190&&!killCheck(s).some(r=>!r.ok));return GOOD;}
function mkSpot(){const [bad,ki]=KILL_EX[Math.floor(Math.random()*KILL_EX.length)];const g=shuffle(goodPool()).slice(0,2);const opts=shuffle([{t:bad,bad:true},...g.map(t=>({t,bad:false}))]);return {k:'spot',opts,ki};}

function orderSR(ids){return ids.map(id=>({id,k:weight(id)+Math.random()*0.9,l:(S.q[id]&&S.q[id].last)||0})).sort((a,b)=>a.k-b.k||a.l-b.l).map(x=>x.id);}

  if(done)h+='<div class="banner '+(c.res==='lh'?'lh':c.res==='ok'?'ok':'miss')+'">'+(c.res==='lh'?'Last Hit!':c.res==='ok'?'Treffer':c.ans<0?'Zeit abgelaufen':'Daneben')+'</div><div class="fbbox '+(c.res==='bad'?'bad':'ok')+'">'+fmt(it[3])+'</div><div class="row"><span class="sp"></span><button class="btn gold" data-act="next">Weiter →</button></div>';

 if(c.k==='fc'){const w=WISSEN.find(x=>x.id===c.id);

 if(c.k==='q'){const q=QM[c.id];

   +'<textarea id="draft" rows="5" style="margin-top:10px" placeholder="Optional: Stichworte oder ganze Antwort tippen …">'+esc(c.draft||'')+'</textarea><div class="row" style="margin-top:12px"><button class="btn gold big" data-act="reveal">Musterantwort zeigen</button><span class="hint">Erst ganz antworten, dann aufdecken.</span></div></div>';return h;}
  h+=(c.draft?'<div class="fbbox"><b>Dein Entwurf:</b> '+esc(c.draft)+' <button class="btn sm" data-act="draftToMine">als „Meine Antwort“ speichern</button></div>':'')+fullCard(q)

 if(c.k==='les'){const l=LESSONS.find(x=>x.id===c.id);

 return h;};

 +'<div class="lbl">MTBF / MTTR</div><p>Laufzeit ÷ Ausfälle (wie oft?) · Reparaturzeit ÷ Ausfälle (wie lange?). 600 h / 12 = 50 h · 18 h / 12 = 1,5 h.</p>'
 +'<div class="lbl">Rollout</div><p>Vorbereitung → Pilotanlage → Modelllinie → Ausrollen in Wellen. Shopfloor-Kaskade Schicht → Bereich → Werk, KPI-Board mit wenigen Kennzahlen.</p>'
 +'<div class="lbl">Lebensmittel</div><p>Sortenwechsel = Rüsten + Reinigung + Freigabe. Vorbereitung vor den Stopp, Hygiene/Allergenfreigabe nie kürzen, Sortenreihenfolge planen, QS früh einbinden. Mehrschicht: Schichtübergabe als Standard.</p>'
 +'<p class="hint"><a href="#lib/wissen">Mehr im Lean-Wissen (TPM-Karten)</a> · <a href="#lib/quiz">Alle Quizfragen</a></p></div></div>'
 +'<div class="grid2"><div class="panel"><h3>Kluge Fragen an den Interviewer</h3><div class="read"><ol class="steps">'+RUECK_JOB.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol></div></div>'
 +'<div class="panel"><h3>Vorbereitung (Hinweise, keine Firmenfakten)</h3><div class="read"><ul class="steps">'+PREP_JOB.map(r=>'<li>'+fmt(r)+'</li>').join('')+'</ul></div></div></div>'
 +'<div class="panel"><h3>Alle Stellen-Fragen</h3>'+GROUPS.filter(([g])=>JOBG.includes(g)).map(([g,l])=>'<h4 style="margin-top:12px">'+esc(l)+'</h4>'+QS.filter(q=>q.g===g).map(q=>'<a class="qrow" href="#lib/q/'+q.id+'"><span class="qt">'+esc(q.q)+'</span>'+chip(rateOf(q.id))+'</a>').join('')).join('')+'</div>';};
/* Spickzettel */
function spickHTML(){const top=QS.filter(q=>q.top);
 return '<div class="spick"><div class="shead"><b>Spickzettel · Lean Consultant (intern)</b><span>Stand '+new Date().toLocaleDateString('de-DE')+'</span></div><div class="scols"><div><h5>Top 10 Fragen – Kern in einer Zeile</h5><ol>'+top.map(q=>'<li><b>'+esc(q.q)+'</b><br>'+fmt(q.kern)+'</li>').join('')+'</ol></div>'
 +'<div><h5>3 Zahlen / Fakten</h5><ol>'+FAKTEN.map(f=>'<li>'+fmt(f)+'</li>').join('')+'</ol><h5>5 Rückfragen <span style="text-transform:none;font-weight:400">(Anrede wie bei euch üblich)</span></h5><ol>'+RUECK.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol>'
 +'<h5>Kill-Phrasen → besser</h5><ul>'+KILLS.map(k=>'<li><b>'+esc(k.k)+'</b> → '+fmt(k.repl.replace(/^Nimm deine echte Schwäche: /,''))+'</li>').join('')+'</ul>'
 +'<h5>Mein Satz für Skeptiker</h5><p style="margin:0">„Jeder Defekt oder jede Verbesserung, die wir beim Rüsten finden, bringt uns einen Schritt näher an eine störungsfreie Maschine.“</p></div></div></div>';}
function fillPrint(){$('#printArea').innerHTML=spickHTML();}
V.spick=()=>'<div class="row" style="margin-bottom:12px"><h1 style="margin:0">Spickzettel</h1><span class="sp"></span><button class="btn gold" data-act="print">Drucken (1 Seite A4)</button></div><div class="read">'+spickHTML()+'</div><p class="hint">Stellen mit <span class="gap">✎ Deine Erfahrung</span> vor dem Gespräch mit eigenen Beispielen füllen.</p>';
V.daten=()=>'<h1>Daten</h1><div class="panel"><p>Alles bleibt lokal in diesem Browser (localStorage „'+KEY+'“). Für ein anderes Gerät: exportieren und dort importieren.</p><div class="row"><button class="btn gold" data-act="export">Export (JSON)</button><button class="btn" data-act="import">Import (JSON)</button><span class="sp"></span><button class="btn red" data-act="reset">Alles zurücksetzen</button></div></div>';
function doExport(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leandota_'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Export erstellt');}
function doImport(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||typeof d.q!=='object')throw 0;localStorage.setItem(KEY,JSON.stringify(d));S=load();toast('Import erfolgreich');render();}catch(e){toast('Import fehlgeschlagen – keine gültige Datei');}};r.readAsText(file);}

/* ===== Router & Timer ===== */
function go(h){if(location.hash!==h)history.pushState(null,'',h);render();window.scrollTo(0,0);}
window.addEventListener('popstate',()=>render());
function render(){const p=(location.hash||'#menu').slice(1).split('/');let r=p[0]||'menu';if(!V[r])r='menu';
 if((r==='map'||r==='battle')&&!M())r='menu';if(r==='battle'&&!M().b)r='map';
 $('#hud').innerHTML=hud();$('#main').innerHTML=V[r](p[1],p[2]);}
let TI=null;function tStop(){}
function tick(){const m=M();if(!m)return;const ck=$('#mclock');if(ck){const t=Math.floor((Date.now()-m.start)/1000);ck.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
 if(location.hash!=='#battle'||document.hidden)return;const c=cur();if(!c||c.left==null||c.ans!=null||c.rev)return;if(c.k==='q'&&c.left<=0)return;
 c.left--;const base=c.k==='quiz'?QUIZ_T:c.k==='spot'?(m.b.type==='jungle'?JUNGLE_T:SPOT_T):MID_T,max=c.max||base;
 const tl=$('#tleft'),tf=$('#tfill'),tb=$('#tbar'),cd=$('#cd'),cdt=$('#cdt');if(tl)tl.textContent=Math.max(0,c.left)+' s';if(tf)tf.style.width=clamp(c.left/max*100,0,100)+'%';if(tb)tb.classList.toggle('low',c.left<=5);
 if(cd){cd.style.background='conic-gradient(var(--gold) '+clamp(c.left/max*100,0,100)+'%,#2a2f3c 0)';cdt.textContent=c.left>0?c.left:'✓';}
 if(c.left<=0){if(c.k==='quiz')quizAnswer(-1);else if(c.k==='spot')spotAnswer(-1);else{toast('90 Sekunden um – jetzt Musterantwort vergleichen');snd('hit');}}
 else saveSoon();}
TI=setInterval(tick,1000);
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ===== Events ===== */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset,m=M(),c=cur();
 switch(a){
 case 'sound':S.sound=!S.sound;save();if(S.sound)snd('gold');render();break;
 case 'gg':if(m&&confirm('Match beenden (GG)?'))endMatch('gg');break;
 case 'pickHero':S.hero=d.h;save();render();break;
 case 'startMatch':if(!S.hero)break;if(!M())startMatch();go('#map');break;
 case 'lane':if(m&&m.b&&!m.b.done&&m.b.type===d.l)go('#battle');else startBattle(d.l);break;
 case 'go':if(d.to==='ancient'&&!ancientOpen()){toast('Ancient gesperrt: erst beide Mid-Tower und insgesamt 4 Tower zerstören.');break;}if(m&&m.b&&!m.b.done&&m.b.type===d.to)go('#battle');else startBattle(d.to);break;
 case 'again':startBattle(m.b.type);break;
 case 'leaveWave':if(confirm('Rückzug? Diese Welle zählt dann nicht.')){m.b=null;save();go('#map');}break;
 case 'qa':quizAnswer(+d.k);break;
 case 'next':if(bossLivesCheck())break;nextCreep();break;
 case 'useHint':{if(!c||c.k!=='quiz'||!S.items.hint)break;const it=QUIZ[c.i];const wr=c.order.map((oi,k)=>({oi,k})).filter(x=>x.oi!==it[2]&&!(c.tried||[]).includes(x.k)).map(x=>x.k);c.hidden=shuffle(wr).slice(0,2);S.items.hint--;save();render();break;}
 case 'useBoots':if(!c||!S.items.boots)break;{const base=c.k==='quiz'?QUIZ_T:c.k==='spot'?(m.b.type==='jungle'?JUNGLE_T:SPOT_T):MID_T;c.left=Math.max(0,c.left)+30;c.max=Math.max(c.max||base,c.left);c.t0=(c.t0||Date.now());S.items.boots--;floatTxt('+30 s','x');save();render();}break;
 case 'useSecond':if(!c||!S.items.second)break;c.second=true;c.usedSecond=true;S.items.second--;save();render();break;
 case 'useScroll':if(!c||!S.items.scroll)break;c.scroll=true;S.items.scroll--;save();render();break;
 case 'reveal':c.draft=($('#draft')||{}).value||c.draft||'';c.rev=true;save();render();break;
 case 'rate':midRate(d.r);break;
 case 'gchk':{if(!c)break;c.chk=c.chk||[false,false,false];c.chk[+d.n]=el.checked;save();break;}
 case 'gchk':{if(!c)break;c.chk=c.chk||[false,false,false];c.chk[+d.n]=el.checked;save();break;}
 case 'draftToMine':{const o=qs(c.id);o.mine=c.draft;save();const mi=$('#mine');if(mi)mi.value=c.draft;toast('Als „Meine Antwort“ gespeichert');break;}
 case 'flip':if(c&&c.k==='fc'&&!c.flip){c.flip=true;save();render();}break;
 case 'fc':fcAnswer(d.v==='1');break;
 case 'lesCheck':c.txt=($('#lesTxt')||{}).value||'';c.checked=true;const lo=S.les[c.id]=S.les[c.id]||{};lo.txt=c.txt;save();render();break;
 case 'les':lesRate(d.v==='1');break;
 case 'spot':spotAnswer(+d.k);break;
 case 'buy':{const it=ITEMS[d.it];if(S.gold<it.p){toast('Zu wenig Gold');break;}S.gold-=it.p;S.items[d.it]=(S.items[d.it]||0)+1;save();floatTxt('−'+it.p+' Gold','g');snd('gold');toast(it.n+' gekauft');render();break;}
 case 'copyMuster':{const mi=$('#mine');if(mi.value.trim()&&!confirm('Deine Antwort mit der Musterantwort überschreiben?'))break;mi.value=QM[mi.dataset.id].muster;qs(mi.dataset.id).mine=mi.value;save();$('#mineWc').textContent=wc(mi.value)+' Wörter';toast('Vorlage übernommen – jetzt in deine Worte bringen');break;}
 case 'checkMine':$('#mineCheck').innerHTML='<div class="read" style="padding:6px 10px;margin-top:8px">'+killHTML(killCheck($('#mine').value))+'</div>';break;
 case 'libReveal':libShown[d.id]=true;render();break;
 case 'libRate':{const id=location.hash.split('/')[2];rateQ(id,d.r);save();toast('Bewertet: '+d.r);render();break;}
 case 'libFilter':S.libFilter=d.g;save();render();break;
 case 'jobLib':S.libFilter='j_tpm';save();go('#lib');break;
 case 'lflip':LF.flip=!LF.flip;render();break;
 case 'lfKnow':S.fc[LF.cards[LF.i].id]=1;save();LF.i++;LF.flip=false;render();break;
 case 'lfAgain':{const k=LF.cards.splice(LF.i,1)[0];delete S.fc[k.id];LF.cards.push(k);LF.flip=false;save();render();break;}
 case 'lfPrev':if(LF.i>0){LF.i--;LF.flip=false;render();}break;
 case 'lfNew':LF=null;render();break;
 case 'lesLib':{const l=LESSONS.find(x=>x.id===d.id),t=(document.querySelector('[data-les="'+d.id+'"]')||{}).value||'';const o=S.les[d.id]=S.les[d.id]||{};o.txt=t;save();
  $('#les_'+d.id).innerHTML='<div class="read" style="margin-top:10px"><b>Checkliste</b> (einfache Wortprüfung)<ul>'+l.check.map(([re,lab])=>'<li>'+(t.trim()&&re.test(t)?'✓ ':'✗ ')+esc(lab)+'</li>').join('')+'</ul><div class="fbbox ok"><b>Musterlösung:</b> '+esc(l.sol)+'</div></div>';break;}
 case 'killRun':{const t=$('#killText').value;S.kill=t;save();$('#killOut').innerHTML=killHTML(killCheck(t));break;}
 case 'print':fillPrint();window.print();break;
 case 'export':doExport();break;
 case 'import':$('#fileImport').click();break;
 case 'reset':if(confirm('Wirklich alles löschen (Profil, Gold, Bewertungen, eigene Antworten)?')){localStorage.removeItem(KEY);S=blank();LF=null;libShown={};toast('Zurückgesetzt');go('#menu');}break;
 }});
document.addEventListener('input',e=>{const t=e.target,c=cur();
 if(t.id==='mine'){qs(t.dataset.id).mine=t.value;saveSoon();const w=$('#mineWc');if(w)w.textContent=wc(t.value)+' Wörter';}
 else if(t.id==='draft'&&c)c.draft=t.value;
 else if(t.id==='lesTxt'&&c)c.txt=t.value;
 else if(t.dataset&&t.dataset.les){const o=S.les[t.dataset.les]=S.les[t.dataset.les]||{};o.txt=t.value;saveSoon();}
 else if(t.id==='killText'){S.kill=t.value;saveSoon();}});
$('#fileImport').addEventListener('change',e=>{const f=e.target.files[0];if(f)doImport(f);e.target.value='';});
window.addEventListener('beforeprint',fillPrint);
fillPrint();render();
</script>
</body>
